<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SoftProdigy · ServiceNow AI Agent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#0A1628;--navy1:#0F1F3D;--navy2:#132448;--navy3:#1A2F57;
  --blue:#1E5EBF;--blue2:#2471E0;--blue3:#3D85F0;--blue-dim:#1E5EBF18;
  --cyan:#00D4FF;--cyan-dim:#00D4FF12;
  --text:#E8EEF8;--text2:#9BAEC8;--text3:#5A6E8A;--text4:#3A4A60;
  --green:#22C55E;--green-dim:#22C55E14;
  --amber:#F59E0B;--amber-dim:#F59E0B14;
  --red:#EF4444;--red-dim:#EF444414;
  --purple:#8B5CF6;
  --border:#1E3A5F;--border2:#253F6A;
  --radius:10px;--radius-sm:6px;
  --font:'Inter','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--navy);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.5}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--navy1)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
input,select,textarea,button{font-family:inherit;font-size:13px;outline:none}
button{cursor:pointer}

.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:230px;background:var(--navy1);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:50px;background:var(--navy1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:24px}

.sb-brand{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-logo{width:34px;height:34px;background:linear-gradient(135deg,var(--blue2),var(--cyan));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;flex-shrink:0}
.sb-name{font-size:14px;font-weight:800;color:var(--text)}
.sb-sub{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.9px}
.sb-instance{padding:10px 14px;border-bottom:1px solid var(--border)}
.sb-inst-label{font-size:9px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.sb-inst-val{font-size:11px;color:var(--cyan);display:flex;align-items:center;gap:6px}
.sb-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0}
.sb-section{font-size:9px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.9px;padding:10px 16px 3px}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;border-left:2px solid transparent;transition:all .12s;color:var(--text3);font-size:12px;font-weight:500}
.sb-item:hover{background:var(--navy2);color:var(--text)}
.sb-item.active{background:var(--blue-dim);border-left-color:var(--blue3);color:var(--text)}
.sb-item svg{width:14px;height:14px;flex-shrink:0;opacity:.7}
.sb-item.active svg{opacity:1;color:var(--blue3)}
.sb-badge{margin-left:auto;border-radius:10px;padding:1px 6px;font-size:9px;font-weight:700}
.sb-badge.blue{background:var(--blue2);color:#fff}
.sb-badge.green{background:var(--green);color:#000}
.sb-badge.amber{background:var(--amber);color:#000}
.sb-footer{padding:12px;border-top:1px solid var(--border)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);border:none;font-size:12px;font-weight:600;transition:all .12s;white-space:nowrap;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--blue2),var(--blue3));color:#fff}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-primary:disabled{background:var(--navy3);color:var(--text3);cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{background:var(--navy2);color:var(--text)}
.btn-success{background:var(--green-dim);color:var(--green);border:1px solid #22C55E40}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid #EF444440}
.btn-sm{padding:5px 12px;font-size:11px}
.btn-xs{padding:3px 8px;font-size:10px}

.card{background:var(--navy1);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--navy2)}
.card-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.5px}
.card-body{padding:18px}

.field-label{display:block;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.field-input,.inp{width:100%;background:var(--navy);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 13px;color:var(--text);transition:border-color .12s}
.field-input:focus,.inp:focus{border-color:var(--blue2)}
.field-input::placeholder,.inp::placeholder{color:var(--text4)}
textarea.field-input{resize:vertical;min-height:140px;font-size:12px;line-height:1.6}

.connect-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy)}
.connect-card{width:420px;background:var(--navy1);border:1px solid var(--border);border-radius:14px;padding:40px;box-shadow:0 20px 60px #00000060}
.connect-logo{width:56px;height:56px;background:linear-gradient(135deg,var(--blue2),var(--cyan));border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;margin:0 auto 18px}
.error-bar{background:var(--red-dim);border:1px solid #EF444440;border-radius:var(--radius-sm);padding:8px 12px;font-size:12px;color:var(--red);margin-bottom:12px}

.steps{display:flex;align-items:center;margin-bottom:24px}
.step-item{display:flex;align-items:center;gap:8px}
.step-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;transition:all .3s}
.step-num.done{background:var(--green);color:#fff}
.step-num.active{background:var(--blue2);color:#fff;box-shadow:0 0 0 3px var(--blue-dim)}
.step-num.pending{background:var(--navy3);color:var(--text3)}
.step-label{font-size:11px;font-weight:600;color:var(--text3);white-space:nowrap}
.step-label.active{color:var(--text)}
.step-label.done{color:var(--green)}
.step-conn{flex:1;height:1px;background:var(--border);margin:0 8px}
.step-conn.done{background:var(--green)}

.story-row{background:var(--navy2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:8px}
.story-row:hover{border-color:var(--border2)}

.pri{display:inline-flex;align-items:center;border-radius:3px;padding:2px 8px;font-size:10px;font-weight:700}
.pri-critical{background:#7F1D1D;color:#FCA5A5}
.pri-high{background:var(--amber-dim);color:var(--amber)}
.pri-medium{background:var(--blue-dim);color:var(--blue3)}
.pri-low{background:var(--green-dim);color:var(--green)}

.badge{display:inline-flex;align-items:center;border-radius:3px;padding:2px 7px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.badge-blue{background:var(--blue-dim);color:var(--blue3)}
.badge-green{background:var(--green-dim);color:var(--green)}
.badge-amber{background:var(--amber-dim);color:var(--amber)}
.badge-red{background:var(--red-dim);color:var(--red)}
.badge-gray{background:#ffffff10;color:var(--text3)}

.stat{background:var(--navy2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.stat-val{font-size:28px;font-weight:800;line-height:1;margin-bottom:5px}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}

.doc-card{background:var(--navy2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;transition:border-color .12s}
.doc-card:hover{border-color:var(--border2)}
.doc-card.generating{border-color:var(--blue2);background:var(--blue-dim)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

.sh{margin-bottom:20px}
.sh-title{font-size:20px;font-weight:800;color:var(--text);margin-bottom:4px}
.sh-desc{font-size:12px;color:var(--text3)}
.empty{text-align:center;padding:40px 16px;color:var(--text3)}
.empty-icon{font-size:32px;margin-bottom:10px;opacity:.4}
.prog{height:4px;background:var(--navy3);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .5s}

.info-box{background:var(--blue-dim);border:1px solid #1E5EBF30;border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:var(--text2);margin-bottom:14px}
.success-box{background:var(--green-dim);border:1px solid #22C55E30;border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:var(--green);margin-bottom:14px}
.warn-box{background:var(--amber-dim);border:1px solid #F59E0B30;border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:var(--amber);margin-bottom:14px}

.dropzone{border:2px dashed var(--border2);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:all .15s}
.dropzone:hover,.dropzone.drag{border-color:var(--blue2);background:var(--blue-dim)}

.input-tabs{display:flex;gap:4px;margin-bottom:14px}
.input-tab{padding:6px 14px;border-radius:var(--radius-sm);font-size:11px;font-weight:600;cursor:pointer;background:transparent;border:1px solid var(--border);color:var(--text3);transition:all .12s}
.input-tab.active{background:var(--blue-dim);border-color:var(--blue2);color:var(--text)}

.chat-msg{margin-bottom:14px;display:flex;gap:10px}
.chat-msg.user{flex-direction:row-reverse}
.chat-bubble{max-width:75%;background:var(--navy2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:12px;line-height:1.6;color:var(--text2)}
.chat-msg.user .chat-bubble{background:var(--blue-dim);border-color:#2471E030;color:var(--text)}
.chat-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px;background:var(--navy3);color:var(--text3)}
.chat-msg.user .chat-avatar{background:var(--blue-dim);color:var(--blue3)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.spinning{animation:spin .8s linear infinite;display:inline-block}
.pulsing{animation:pulse 1.4s infinite}
.slide-in{animation:slideIn .25s ease}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ════════════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════════════
// Agent API: same origin when served from the agent (/ui), else localhost:8001
const API=(location.protocol.startsWith('http')&&location.pathname.startsWith('/ui'))?location.origin:'http://localhost:8001';
const _nativeFetch=window.fetch.bind(window);
window.fetch=(url,opts={})=>{
  if(String(url).startsWith(API)){
    const h={...(opts.headers||{})};delete h.Authorization;
    if(S.apiKey)h['X-API-Key']=S.apiKey;
    opts={...opts,headers:h};
  }
  return _nativeFetch(url,opts);
};
async function apiErr(r){const e=await r.json().catch(()=>({}));let d=e.detail;if(Array.isArray(d))d=d.map(x=>x.msg||JSON.stringify(x)).join('; ');return d||`HTTP ${r.status}`;}
async function post(path,body){
  const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  if(!r.ok)throw new Error(await apiErr(r));
  return r.json();
}
function creds(){return{snow_url:S.instanceUrl,snow_user:S.username,snow_pass:S.password};}

const S={
  connected:false,connecting:false,connError:'',showPass:false,debugResult:null,
  instanceUrl:'',username:'',password:'',apiKey:'',login:null,agentCfg:null,
  plannerPreflight:null,
  activeSection:'chat',
  inputTab:'text',       // text | file

  // Implement 4-step flow
  implStep:0,
  implBusy:false,
  userStoriesInput:'',
  parsedStories:[],      // [{id,story,criteria,priority,module,status}]
  reqPlans:{},reqBusy:false,   // requirement pipeline plans by plan_id (report shown in MCP Chat / Implement)
  generatedDocs:[],      // [{key,name,desc,icon,backend,status,content,clientContent}]
  deployResults:[],      // [{status,sys_id,table,number,error}]
  implLog:[],
  projectTitle:'',
  projectOverview:'',

  // Health scan
  scanStatus:'idle',
  scanResult:null,
  scanError:'',

  // Chat
  chatMessages:[],chatInput:'',chatLoading:false,
  // MCP chat (uses the local ServiceNow MCP bridge)
  mcpMessages:[],mcpInput:'',mcpLoading:false,

  // Build app (plan -> update set -> deploy)
  build:{source:'stories',reqText:'',planning:false,plan:null,planText:'',validation:null,planError:'',
         scopeMode:'scoped',appName:'',existingApp:'',apps:[],usMode:'new',usName:'',usSysId:'',usList:[],
         stopOnError:true,rollbackOnError:true,restorePrev:false,dryRun:false,jobId:'',job:null,polling:false,error:'',
         changes:null,completed:null,flowEngine:'auto',flowPause:true,reuseSubflows:true,responding:false},
  // Operations screen
  ops:{tab:'approvals',busy:false,error:'',approvals:null,catQ:'',catalog:null,orderResult:null,kbQ:'',kb:null,
       kbTitle:'',kbText:'',kbAI:false,kbPub:false,kbCreated:null,packages:null,total:0,pkg:'',toolQ:'',tools:null,
       tool:null,args:{},result:null,running:false,askQ:'',asking:false},
  // Update sets screen
  us:{loading:false,list:[],current:'',error:'',filterApp:'',changes:null,changesFor:''},

  // Audit
  auditLog:[],

  // ACC Deployment
  acc:{
    tab:'generate',           // generate | setup | cmdcenter | waves | gates | report
    // Generate package
    genInputTab:'text',       // text | file
    genText:'',
    genJobId:'',genJobPoll:null,genStatus:null,genError:'',
    // Setup
    setupAppName:'SoftProdigyACC',setupIncludeCmdb:true,setupBusy:false,setupResult:null,setupError:'',
    seedBusy:false,seedResult:null,seedError:'',
    // Command center
    ccBusy:false,ccData:null,ccError:'',ccTarget:'',
    // Waves
    wavesBusy:false,wavesError:'',waveUpdateBusy:false,
    selectedWave:null,waveNewStatus:'',waveDeployed:'',
    // Stage Gates
    gatesBusy:false,gatesBriefing:null,gatesBriefBusy:false,
    selectedGate:null,gateDecide:{reason:'',approver:'',confirm:false},
    gateDecideBusy:false,gateDecideResult:null,gateDecideError:'',
    gateAuditBusy:false,gateAuditRows:null,
    // Report
    reportBusy:false,reportError:'',
    // Duplicates
    dupBusy:false,dupData:null,dupError:'',
  },
};

// Remember the last instance URL + username in this browser (never the password)
try{const last=JSON.parse(localStorage.getItem('hai_last_login')||'{}');S.instanceUrl=last.url||'';S.username=last.user||'';}catch(_){}
function rememberLogin(){try{localStorage.setItem('hai_last_login',JSON.stringify({url:S.instanceUrl,user:S.username}));}catch(_){}}

function logAudit(action,detail='',status='info'){
  S.auditLog.unshift({action,detail,status,ts:new Date().toLocaleTimeString()});
  if(S.auditLog.length>300)S.auditLog.length=300;
}
function implLog(msg,type='info'){
  S.implLog.push({msg,type,ts:new Date().toLocaleTimeString()});
  logAudit(msg,'',type);
}

// ════════════════════════════════════════════════════════════════════════════
// ICONS
// ════════════════════════════════════════════════════════════════════════════
const IC={
  bolt:`<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>`,
  scan:`<path d="M3 9V5a2 2 0 0 1 2-2h4"/><path d="M15 3h4a2 2 0 0 1 2 2v4"/><path d="M21 15v4a2 2 0 0 1-2 2h-4"/><path d="M9 21H5a2 2 0 0 1-2-2v-4"/><line x1="8" y1="12" x2="16" y2="12"/>`,
  chat:`<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>`,
  audit:`<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>`,
  settings:`<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>`,
  download:`<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>`,
  deploy:`<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>`,
  send:`<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>`,
  disconnect:`<path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>`,
  upload:`<polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>`,
  check:`<polyline points="20 6 9 17 4 12"/>`,
  x:`<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>`,
  script:`<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>`,
  users:`<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`,
  plug:`<path d="M12 22V12"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/><path d="M8 3v3"/><path d="M16 3v3"/><rect x="8" y="6" width="8" height="6" rx="1"/>`,
};
function ico(key,size=14){return`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${IC[key]||''}</svg>`;}

// ════════════════════════════════════════════════════════════════════════════
// RENDER ENGINE
// ════════════════════════════════════════════════════════════════════════════
const NAV=[
  {section:'Workspace'},
  {id:'implement',icon:'bolt',label:'Implement'},
  {id:'build',icon:'deploy',label:'Build App'},
  {id:'users',icon:'users',label:'User Management'},
  {id:'updatesets',icon:'upload',label:'Update Sets'},
  {id:'ops',icon:'check',label:'Operations'},
  {id:'healthscan',icon:'scan',label:'Health Scan'},
  {id:'chat',icon:'chat',label:'AI Agent'},
  {id:'mcpchat',icon:'plug',label:'MCP Chat'},
  {section:'System'},
  {id:'audit',icon:'audit',label:'Activity Log'},
];

function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function rAll(){document.getElementById('root').innerHTML=!S.connected?renderConnect():renderApp();bind();}
const SECTION_TITLES={ops:'🧰 Operations',implement:'⚡ Implement',build:'🏗️ Build App',users:'👥 User Management',updatesets:'📦 Update Sets',healthscan:'🔍 Health Scan',chat:'🤖 AI Agent',mcpchat:'🔌 MCP Chat',audit:'📋 Activity Log',settings:'⚙ Connection'};
function refresh(){const el=document.getElementById('mc');if(el){el.innerHTML=renderSection();bind();}const tt=document.getElementById('top-title');if(tt)tt.textContent=SECTION_TITLES[S.activeSection]||'SoftProdigy';document.querySelectorAll('[data-nav]').forEach(e=>e.classList.toggle('active',e.dataset.nav===S.activeSection));}

// ════════════════════════════════════════════════════════════════════════════
// CONNECT
// ════════════════════════════════════════════════════════════════════════════
function renderConnect(){
  const cfgUrl=S.agentCfg&&S.agentCfg.instance_url;
  const savedUrl=cfgUrl||S.instanceUrl||'';
  return`<div class="connect-screen"><div class="connect-card">
    <div class="connect-logo">SN</div>

function renderSection(){
  switch(S.activeSection){
    case 'implement':  return renderImplement();
    case 'healthscan': return renderHealthScan();
    case 'build':      return renderBuild();
    case 'users':      return renderUsers();
    case 'updatesets': return renderUpdateSets();
    case 'ops':        return opsRender();
    case 'chat':       return renderChat();
    case 'mcpchat':    return renderMcpChat();
    case 'audit':      return renderAudit();
    case 'settings':   return renderSettings();
    default:           return renderImplement();
  }
}

function renderPlannerPreflight(){
  const p=S.plannerPreflight;
  if(!S.connected)return`<div class="info-box">Connect to ServiceNow to check release, environment, identity, permissions, scope, active Update Set and MCP readiness before planning.</div>`;
  if(!p)return`<div class="info-box">Planner readiness has not been checked. <button class="btn btn-ghost btn-xs" id="btn-planner-preflight">Check readiness</button></div>`;
  if(p.loading)return`<div class="info-box">Checking the connected instance and MCP planner capabilities…</div>`;
  if(p.error)return`<div class="warn-box">Planner preflight unavailable: ${esc(p.error)} <button class="btn btn-ghost btn-xs" id="btn-planner-preflight">Retry</button></div>`;
  const ready=!!p.execution_ready;
  const e=p.environment||{},r=p.release||{},i=p.identity||{},s=p.scope||{},u=p.update_set||{},m=p.mcp||{};
  const line=(label,value)=>`<div><strong>${esc(label)}:</strong> ${esc(String(value||'unknown'))}</div>`;
  return`<div class="${ready?'success-box':'warn-box'}" style="margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><strong>Planner preflight · ${ready?'ready':'blocked'}</strong><button class="btn btn-ghost btn-xs" id="btn-planner-preflight">Refresh</button></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 14px;margin-top:7px;font-size:11px">
      ${line('Instance',p.instance_url)}${line('Environment',`${e.type} (${e.verified?'verified':e.source||'unverified'})`)}
      ${line('Release',`${r.family} · ${r.build_tag} · patch ${r.patch_level} (${r.verified?'verified':'unverified'})`)}
      ${line('Identity',`${i.display_name||i.username} · ${i.username} · ${i.roles?.join(', ')||'roles unknown'}`)}
      ${line('Permissions',`${p.permissions?.verified?'admin role confirmed':'write permission unverified'}; write ACLs are not probed`)}
      ${line('Application scope',`${s.name||'unknown'} · ${s.verified?'verified':'unverified'}`)}
      ${line('Active Update Set',`${u.name||'unknown'} · ${u.state||'state unknown'} · ${u.verified?'verified':'unverified'}`)}
      ${line('MCP planner',`${m.available?'reachable':'unavailable'} · ${m.tool_count||0} tools · ${m.missing_tools?.length?'missing '+m.missing_tools.join(', '):'required tools present'}`)}
    </div>
    ${p.blockers?.length?`<div style="margin-top:7px">${p.blockers.map(x=>`<div>• ${esc(x)}</div>`).join('')}</div>`:''}
    <div style="margin-top:6px;font-size:10px;color:var(--text3)">Read-only checks cannot prove every table/field write ACL. Unknown environment or permissions block strict Planner execution.</div>
  </div>`;
}

async function refreshPlannerPreflight(){
  if(!S.connected)return null;
  S.plannerPreflight={loading:true};refresh();
  try{S.plannerPreflight=await post('/snow/planner/preflight',creds());}
  catch(e){S.plannerPreflight={error:e.message};}
  refresh();return S.plannerPreflight;
}

  const pending=stories.length-deployed-failed;
  return`
<div class="card">
  <div class="card-hdr">
    <div class="card-title">🚀 Deploy to ServiceNow</div>
    <button class="btn btn-ghost btn-sm" id="btn-back-2">← Back</button>
  </div>
  <div class="card-body">
    <div class="warn-box">⚠️ Each story requires your approval before it is created in <strong>${esc(S.instanceUrl)}</strong>. After each deployment you will be asked whether to continue.</div>
    ${results.length>0?`<div class="grid-3" style="margin-bottom:16px">
      <div class="stat"><div class="stat-val" style="color:var(--green)">${deployed}</div><div class="stat-label">Deployed</div></div>
      <div class="stat"><div class="stat-val" style="color:var(--red)">${failed}</div><div class="stat-label">Failed</div></div>
      <div class="stat"><div class="stat-val" style="color:var(--text3)">${pending}</div><div class="stat-label">Pending</div></div>
    </div>`:''}
    ${stories.map((s,i)=>{
      const r=results[i]||{};
      const icon=r.status==='deployed'?'✅':r.status==='failed'?'❌':r.status==='running'?'⏳':r.status==='skipped'?'⏭️':'⬜';
      const detectedType=s.story_type&&s.story_type!=='story'?s.story_type:detectStoryType(s.story,s.criteria||'');
      const typeLabel=r.story_type?STORY_TYPE_LABEL[r.story_type]:STORY_TYPE_LABEL[detectedType]||'📋 TASK';
      const typeColor=r.story_type?STORY_TYPE_COLOR[r.story_type]:STORY_TYPE_COLOR[detectedType]||'var(--blue3)';
      return`<div class="story-row" style="display:flex;align-items:center;gap:12px">
        <span style="font-size:16px;flex-shrink:0">${icon}</span>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
            <span class="pri pri-${s.priority||'medium'}">${(s.priority||'medium').toUpperCase()}</span>
            <span style="font-size:10px;font-weight:700;color:${typeColor};background:${typeColor}22;border-radius:4px;padding:1px 6px">${typeLabel}</span>
            <span class="badge badge-blue">${esc(s.module||'General')}</span>
            ${r.status==='deployed'?`<a href="${esc(r.link||'#')}" target="_blank" style="font-size:10px;color:var(--cyan);text-decoration:none">${esc(r.table||'')} · <strong>${esc(r.number||r.sys_id||'')}</strong> ↗</a>${r.assignment_group?`<span style="font-size:10px;color:var(--text3)"> · ${esc(r.assignment_group)}</span>`:''}`:''}
          </div>
          <div style="font-size:12px;color:var(--text);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.story.length>110?s.story.slice(0,110)+'…':s.story)}</div>
          ${r.status==='failed'?`<div style="font-size:11px;color:var(--red);margin-top:3px">⚠ ${esc(r.error||'Deployment failed')}</div>`:''}
          ${r.status==='deployed'?renderStoryBuild(r.build)+(r.reqPlanId?renderReqReport(S.reqPlans[r.reqPlanId],'impl'):'')+(r.reqError?`<div style="font-size:11px;color:var(--amber);margin-top:3px">⚠ Requirement not planned: ${esc(r.reqError)}</div>`:''):!r.status&&isBuildableStory(s)?`<div style="font-size:10px;color:var(--text3);margin-top:3px">🧩 Configuration in this story is planned against your instance — you review and confirm before anything is built</div>`:''}
        </div>
        <div style="flex-shrink:0">
          ${!r.status||r.status==='pending'?`<button class="btn btn-primary btn-sm" data-deploy="${i}" ${S.implBusy?'disabled':''}>Deploy</button>`
            :r.status==='running'?`<span style="font-size:11px;color:var(--amber)">Running…</span>`
            :r.status==='deployed'?`<span style="font-size:11px;color:var(--green)">✓ Done</span>`
            :r.status==='skipped'?`<button class="btn btn-ghost btn-xs" data-deploy="${i}">Deploy</button>`
            :`<button class="btn btn-ghost btn-xs" data-deploy="${i}">Retry</button>`}
        </div>
      </div>`;}).join('')}
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-primary" id="btn-deploy-all" style="padding:10px 28px" ${S.implBusy?'disabled':''}>
        ${S.implBusy?'<span class="spinning">⟳</span> Deploying…':'🚀 Approve &amp; Deploy All'}
      </button>
      <button class="btn btn-ghost btn-sm" id="btn-restart">↺ Start Over</button>
    </div>
  </div>
</div>`;
}

function renderHealthScan(){
  const score=S.scanResult?S.scanResult.overall_score:null;

  return`

${S.scanStatus==='idle'||S.scanStatus==='error'?`
<div class="card">
  <div class="card-hdr"><div class="card-title">🔍 Run Instance Health Scan</div></div>
  <div class="card-body">
    <div class="info-box">📡 24 live, read-only checks across 6 areas. Checks that cannot run on your instance (plugin missing, no access) are shown as <em>unknown</em> and are not scored.</div>
    ${S.scanError?`<div class="error-bar">${esc(S.scanError)}</div>`:''}
    <div class="grid-3" style="margin-bottom:20px">
      ${[['🛡️','Security','Admins, MFA, CSRF, sessions'],['🗃️','CMDB','Stale, unowned, nameless CIs'],['🚨','Incidents','Routing, P1s, SLA breaches, backlog'],['🔄','Changes','Approvals, overdue, emergency share'],['⚡','Platform','Slow transactions, script anti-patterns'],['📋','Governance','ATF, ACLs on custom tables, auditing']].map(([icon,name,desc])=>`
      <div class="stat" style="text-align:left;padding:14px">
        <div style="font-size:20px;margin-bottom:5px">${icon}</div>
        <div style="font-size:11px;font-weight:700;color:var(--text)">${name}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:2px">${desc}</div>
      </div>`).join('')}
    </div>
    <button class="btn btn-primary" id="btn-run-scan" style="padding:11px 28px">
      ${ico('scan',14)} Run Health Scan
    </button>
  </div>
</div>`:''}

${S.scanStatus==='running'?`
<div class="card">
  <div class="card-hdr"><div class="card-title"><span class="pulsing">●</span> Scanning Instance…</div></div>
  <div class="card-body">
    <div class="info-box"><span class="pulsing">●</span> Analyzing <strong>${esc(S.instanceUrl)}</strong> — please wait…</div>
    ${[['🛡️','Security Operations'],['🗃️','CMDB & Assets'],['🚨','Incident Management'],['🔄','Change Management'],['⚡','Platform Performance'],['📋','Compliance & GRC']].map(([icon,label],i)=>`

      <span style="font-size:16px">${icon}</span>

        <div class="prog"><div class="prog-fill pulsing" style="background:var(--blue2);width:${45+i*8}%"></div></div>
      </div>
      <span style="font-size:10px;color:var(--text3)">Analyzing…</span>
    </div>`).join('')}
  </div>
</div>`:''}

${S.scanStatus==='done'&&S.scanResult?`
<div class="grid-4" style="margin-bottom:14px">
  <div class="stat"><div class="stat-val" style="color:${scoreColor};font-size:38px">${score??'n/a'}</div><div class="stat-label">Overall Score</div></div>
  <div class="stat"><div class="stat-val" style="color:var(--red)">${S.scanResult.critical_findings||0}</div><div class="stat-label">Critical</div></div>
  <div class="stat"><div class="stat-val" style="color:var(--amber)">${S.scanResult.warnings||0}</div><div class="stat-label">Warnings</div></div>
  <div class="stat"><div class="stat-val" style="color:var(--green)">${S.scanResult.passed||0}</div><div class="stat-label">Passed</div></div>
</div>
<div class="info-box" style="font-size:11px">Scanned ${esc(S.scanResult.instance)} as ${esc(S.scanResult.scanned_as)} · ${esc(S.scanResult.build||'')} · ${S.scanResult.duration_s}s · ${S.scanResult.unknown} check(s) could not run and are excluded from the score.</div>
<div class="card" style="margin-bottom:14px">
  <div class="card-hdr"><div class="card-title">📊 Category Scores</div><button class="btn btn-ghost btn-sm" id="btn-run-scan">↺ Re-scan</button></div>
  <div class="card-body" style="padding:0">
    ${(S.scanResult.categories||[]).map(cat=>{const cs=cat.score;const cc=cs==null?'var(--text3)':cs>=80?'var(--green)':cs>=60?'var(--amber)':'var(--red)';return`
    <div style="display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border)">

          <div style="font-size:12px;font-weight:700;color:var(--text)">${esc(cat.label)}</div>
          <div style="font-size:13px;font-weight:800;color:${cc}">${cs==null?'n/a':cs+'/100'} <span style="font-size:10px;color:var(--text3);font-weight:500">${cat.checks_run} run${cat.checks_unknown?` · ${cat.checks_unknown} unknown`:''}</span></div>
        </div>
        <div class="prog"><div class="prog-fill" style="background:${cc};width:${cs||0}%"></div></div>
        ${cat.summary?`<div style="font-size:11px;color:var(--text3);margin-top:4px">${esc(cat.summary)}</div>`:''}
      </div>
    </div>`;}).join('')}
  </div>
</div>
${(S.scanResult.findings||[]).length>0?`
<div class="card">
  <div class="card-hdr"><div class="card-title">⚠️ Findings &amp; Recommendations</div></div>
  <div class="card-body" style="padding:0">
    ${(S.scanResult.findings||[]).map(f=>{const sev=(f.severity||'medium').toLowerCase();const bc=sev==='critical'?'badge-red':sev==='high'?'badge-amber':sev==='medium'?'badge-blue':'badge-gray';return`
    <div style="padding:14px 18px;border-bottom:1px solid var(--border)">
      <div style="display:flex;gap:10px;align-items:flex-start">
        <span class="badge ${bc}">${sev.toUpperCase()}</span>
        <div>
          <div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:3px">${esc(f.title||f.finding)}</div>
          <div style="font-size:11px;color:var(--text3);line-height:1.5">${esc(f.description||'')}</div>
          ${f.recommendation?`<div style="font-size:11px;color:var(--cyan);margin-top:4px">💡 ${esc(f.recommendation)}</div>`:''}
          ${f.link?`<a href="${esc(f.link)}" target="_blank" style="font-size:11px;color:var(--blue3)">Open the affected records in ServiceNow ↗</a>`:''}
        </div>
      </div>
    </div>`;}).join('')}
  </div>
</div>`:''}
`:''}`;
}

function defaultUsName(){
  const b=S.build,base=(b.appName||(b.plan&&b.plan.app_name)||'app').replace(/[^A-Za-z0-9]+/g,'_').slice(0,30);
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  return `HAI_${base}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}
function planCounts(pl){return pl?['roles','tables','acls','script_includes','business_rules','client_scripts','ui_policies','notifications','subflows','flows'].map(k=>[k,(pl[k]||[]).length]):[];}
const BUILD_ACTIVE=['queued','running','waiting_input'];
function flowEngineNote(b,v){
  const nS=(b.plan.subflows||[]).length,nF=(b.plan.flows||[]).length;if((!nS&&!nF)||!v)return'';
  const en=v.flow_engines||{},eng=v.flow_engine;
  const startSrv='start it with <code>start_agent.bat</code>, or run <code>npm run dev</code> in <code>v6\\flow-server</code>';
  if(!eng)return`<div class="warn-box">⚠️ The plan has ${nS} subflow(s) and ${nF} flow(s), but no flow engine is available: the Flow Server is not running (${startSrv}) and Playwright is not installed for the browser fallback. They will be <strong>skipped</strong> (not faked).</div>`;
  if(eng==='server')return`<div class="info-box">⚙️ ${nS} subflow(s) and ${nF} flow(s) will be built <strong>automatically</strong> by the Flow Server (ServiceNow SDK): subflows first, then the flows that call them — no clicking needed. ${en.browser?'If an item cannot be built automatically, <strong>only that item</strong> is built in the Flow Designer browser (a Chromium window opens and the build pauses here) — so a browser window means the automatic route failed for it.':'Browser fallback is not available (Playwright not installed).'}</div>`;
  return`<div class="warn-box">🌐 The Flow Server is not running, so ${nS} subflow(s) and ${nF} flow(s) will be built in the <strong>Flow Designer browser</strong> (a Chromium window opens and the build pauses here for each step). For automatic builds, ${startSrv}, then generate or validate the plan again.</div>`;
}
function flowPlanList(pl){
  const subs=pl.subflows||[],flows=pl.flows||[];if(!subs.length&&!flows.length)return'';
  return`<div style="margin-top:10px;font-size:11px;color:var(--text2)">
    ${subs.map(s=>`<div>🧩 <strong>${esc(s.name)}</strong> — inputs: ${(s.inputs||[]).map(i=>esc(i.name)+':'+esc(i.type)).join(', ')||'none'} · ${(s.actions||[]).map(a=>esc(a.type)).join(' → ')||'no actions'}</div>`).join('')}
    ${flows.map(f=>`<div>🔀 <strong>${esc(f.name)}</strong> — ${esc((f.trigger||{}).type||'')} on ${esc((f.trigger||{}).table||'?')}${(f.actions||[]).length?' · '+f.actions.map(a=>esc(a.type)).join(' → '):''}${f.subflow?` · calls 🧩 ${esc(f.subflow)}`:''}</div>`).join('')}
  </div>`;
}
function renderBuildPause(job){
  const p=job.pause;if(job.status!=='waiting_input'||!p)return'';
  const labels={continue:'✅ Continue',retry:'🔁 Retry',skip:'⏭️ Skip',cancel:'✖ Cancel build'};
  const pre=Object.entries(p.prefilled||{});
  return`<div style="margin-top:14px;padding:14px;background:var(--navy2);border:1px solid var(--amber);border-radius:8px">
    <div style="font-size:13px;font-weight:700;color:var(--amber);margin-bottom:6px">⏸️ ${esc(p.title||'Waiting for you')}</div>
    <div style="font-size:12px;color:var(--text2);line-height:1.6;white-space:pre-wrap">${esc(p.message||'')}</div>
    ${(p.fields||[]).length?`<div style="margin-top:8px;font-size:11px;color:var(--text3)">Check in the browser window:</div><ul style="margin:4px 0 0 18px;font-size:12px;color:var(--text)">${p.fields.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
    ${pre.length?`<div style="margin-top:8px;font-size:11px;color:var(--text3)">Pre-filled by the agent:</div><div style="font-size:11px;color:var(--text2)">${pre.map(([k,v])=>`<div><strong>${esc(k)}:</strong> ${esc(String(v).slice(0,160))}</div>`).join('')}</div>`:''}
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">${(p.options||['continue']).map(o=>`<button class="btn ${o==='continue'?'btn-primary':o==='cancel'?'btn-danger':'btn-ghost'} btn-sm" data-pause-act="${esc(o)}" ${S.build.responding?'disabled':''}>${labels[o]||esc(o)}</button>`).join('')}</div>
    <div style="font-size:10px;color:var(--text4);margin-top:8px">Waiting since ${esc((p.since||'').slice(11,19))} · the build gives up after ${Math.round((p.timeout_s||1800)/60)} min without an answer.</div>
  </div>`;
}

async function buildGeneratePlan(){
  const b=S.build;
  const req=b.source==='text'?b.reqText.trim():storyTextBlock();
  if(!req){b.planError='Nothing to plan from';refresh();return;}
  b.planning=true;b.planError='';refresh();
  try{
    const data=await post('/snow/plan',{requirements:req,...creds()});
    b.validation=data._validation;delete data._validation;b.plan=data;
    b.appName=b.appName||data.app_name;b.usName='';
    logAudit(`Build plan ready: ${data.app_name}`,'',b.validation.valid?'success':'warn');
  }catch(e){b.planError=e.message;}
  b.planning=false;refresh();
}
async function buildValidate(obj){
  const b=S.build;
  try{const v=await post('/snow/build/validate',{plan:obj});b.plan=v.plan;b.validation=v;b.planError='';b.appName=b.appName||v.plan.app_name;}
  catch(e){b.planError=e.message;}
  refresh();
}
async function buildLoadApps(){
  try{const d=await post('/snow/apps/list',creds());S.build.apps=d.apps;S.build.error='';}catch(e){S.build.error=e.message;}
  refresh();
}
async function buildLoadUpdateSets(){
  const b=S.build;
  const application=b.scopeMode==='existing'?b.existingApp:b.scopeMode==='global'?'global':'';
  try{const d=await post('/snow/updatesets/list',{...creds(),application:application||undefined});b.usList=d.update_sets;b.error='';}
  catch(e){b.error=e.message;}
  refresh();
}
async function buildStart(){
  const b=S.build;
  if(b.scopeMode==='existing'&&!b.existingApp){b.error='Choose an application';refresh();return;}
  if(b.usMode==='existing'&&!b.usSysId){b.error='Choose an update set';refresh();return;}
  const usInput=document.getElementById('b-usname');
  if(b.usMode==='new')b.usName=(usInput&&usInput.value.trim())||b.usName||defaultUsName();
  const ok=await confirmDialog('🚀 Build in ServiceNow?',`<div style="font-size:12px;color:var(--text2);line-height:1.7">
    Instance: <strong>${esc(S.instanceUrl)}</strong><br>Scope: <strong>${esc(b.scopeMode==='scoped'?'new/reused scoped app "'+(b.appName||b.plan.app_name)+'"':b.scopeMode==='global'?'Global':(b.apps.find(a=>a.sys_id===b.existingApp)||{}).name||b.existingApp)}</strong><br>
    Update set: <strong>${esc(b.usMode==='new'?(b.usName||defaultUsName()):(b.usList.find(u=>u.sys_id===b.usSysId)||{}).name||b.usSysId)}</strong><br>
    Artifacts: ${planCounts(b.plan).filter(x=>x[1]).map(([k,n])=>n+' '+k.replace(/_/g,' ')).join(', ')}</div>`);
  if(!ok)return;
  b.error='';b.changes=null;b.completed=null;
  try{
    const renamed=b.appName&&b.appName!==b.plan.app_name;
    const d=await post('/snow/build',{...creds(),plan:b.plan,scope_mode:b.scopeMode,app_name:b.appName||b.plan.app_name,
      app_scope:renamed?b.appName.toLowerCase().replace(/[^a-z0-9]/g,''):undefined,
      existing_app:b.scopeMode==='existing'?b.existingApp:undefined,
      update_set_name:b.usMode==='new'?(b.usName||defaultUsName()):undefined,
      update_set_sys_id:b.usMode==='existing'?b.usSysId:undefined,
      stop_on_error:b.stopOnError,rollback_on_error:b.rollbackOnError,restore_previous_context:b.restorePrev,
      ignore_validation:!!b.ignoreValidation,dry_run:!!b.dryRun,
      flow_engine:b.flowEngine,flow_pause:!!b.flowPause,reuse_subflows:!!b.reuseSubflows});
    b.jobId=d.job_id;b.job={status:'queued',steps:[]};logAudit(`Build started (${d.job_id}${b.dryRun?' dry-run':''})`,'','info');
    refresh();pollBuild();
  }catch(e){b.error=e.message;refresh();}
}
async function pollBuild(){
  const b=S.build;if(b.polling)return;b.polling=true;
  try{
    while(b.jobId){
      const r=await fetch(`${API}/snow/build/${b.jobId}`);
      if(!r.ok){b.error=await apiErr(r);break;}
      b.job=await r.json();
      if(S.activeSection==='build')refresh();
      if(b.job.status==='waiting_input'&&b.job.pause&&b.lastPauseId!==b.job.pause.id){b.lastPauseId=b.job.pause.id;logAudit(`Build paused: ${b.job.pause.title}`,'','warn');}
      if(!BUILD_ACTIVE.includes(b.job.status)){
        const isDryRun=b.job.status==='dry_run';
        logAudit(`Build ${b.job.status}: ${isDryRun?`${(b.job.preview||[]).length} items previewed`:JSON.stringify(b.job.summary||{})}`,'',b.job.status==='completed'?'success':isDryRun?'info':b.job.status==='failed'?'error':'warn');
        break;
      }
      await new Promise(res=>setTimeout(res,1500));
    }
  }finally{b.polling=false;refresh();}
}
async function buildRespond(action){
  const b=S.build,p=b.job&&b.job.pause;if(!p||b.responding)return;
  if(action==='cancel'&&!await confirmDialog('Cancel the build?',`<div style="font-size:12px;color:var(--text2)">The flow being built stays as a draft in Flow Designer.${b.rollbackOnError?' Records this run created will be rolled back.':''}</div>`))return;
  b.responding=true;refresh();
  try{await post(`/snow/build/${b.jobId}/respond`,{pause_id:p.id,action});b.job.status='running';b.job.pause=null;}
  catch(e){b.error=e.message;}
  b.responding=false;refresh();
}
async function buildShowChanges(){
  const us=S.build.job&&S.build.job.update_set;if(!us)return;
  try{S.build.changes=await post('/snow/updatesets/changes',{...creds(),update_set_sys_id:us.sys_id});}catch(e){S.build.error=e.message;}
  refresh();
}
async function buildComplete(){
  const us=S.build.job&&S.build.job.update_set;if(!us)return;
  if(!await confirmDialog('Mark update set Complete?',`<div style="font-size:12px;color:var(--text2)">"${esc(us.name)}" will be closed for further changes and ready to move to the next instance.</div>`))return;
  try{S.build.completed=await post('/snow/updatesets/complete',{...creds(),update_set_sys_id:us.sys_id});logAudit(`Update set completed: ${us.name}`,'','success');}
  catch(e){S.build.error=e.message;}
  refresh();
}

async function urLoad(){
  UR_STATE.loading=true;UR_STATE.error='';UR_STATE.list=null;refresh();
  try{
    const p=new URLSearchParams({instance_url:S.instanceUrl,username:S.username,password:S.password,limit:50});

    if(UR_STATE.filterDept)p.set('department',UR_STATE.filterDept);
    if(UR_STATE.filterActive!=='')p.set('active',UR_STATE.filterActive);
    const r=await fetch(API+'/snow/interactive/user/list?'+p);
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||'Failed to load users');
    UR_STATE.list=d.users||[];
  }catch(e){UR_STATE.error=e.message;}
  UR_STATE.loading=false;refresh();
}

async function urCreate(){
  const cf=UR_STATE.createForm;
  if(!cf.firstName||!cf.lastName||!cf.email){UR_STATE.error='First name, last name and email are required.';refresh();return;}
  UR_STATE.creating=true;UR_STATE.error='';refresh();
  try{
    const body={instance_url:S.instanceUrl,username:S.username,password:S.password,
      first_name:cf.firstName,last_name:cf.lastName,email:cf.email,
      user_name:cf.userName||undefined,title:cf.title||undefined,
      department:cf.dept||undefined,phone:cf.phone||undefined};
    const r=await fetch(API+'/snow/interactive/user/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||'Failed to create user');
    UR_STATE.created=d;
    UR_STATE.createForm={open:false,firstName:'',lastName:'',email:'',userName:'',title:'',dept:'',phone:''};
    UR_STATE.list=null;
    logAudit(`User created: ${d.full_name} (${d.user_name})`,'','success');
  }catch(e){UR_STATE.error=e.message;logAudit('User creation failed: '+e.message,'','error');}
  UR_STATE.creating=false;refresh();
}

async function urViewUser(sysId,uname){

function bindBuildAndUpdateSets(q,on){
  const b=S.build;
  on('b-src-stories',()=>{b.source='stories';refresh();});
  on('b-src-text',()=>{b.source='text';refresh();});
  on('b-src-json',()=>{b.source='json';refresh();});
  const req=q('b-req');if(req)req.oninput=e=>{b.reqText=e.target.value;};
  const js=q('b-json');if(js)js.oninput=e=>{b.planText=e.target.value;};
  on('b-gen-plan',buildGeneratePlan);
  on('b-load-json',()=>{try{buildValidate(JSON.parse(b.planText));}catch(e){b.planError='Invalid JSON: '+e.message;refresh();}});
  on('b-apply-edit',()=>{try{buildValidate(JSON.parse(q('b-plan-edit').value));}catch(e){b.planError='Invalid JSON: '+e.message;refresh();}});

function opsField(name,d,req,val){
  const t=d.type||(d.anyOf&&(d.anyOf.find(x=>x.type!=='null')||{}).type)||'string';
  const label=`<label class="field-label">${esc(name)}${req?' *':''} <span style="text-transform:none;font-weight:400;color:var(--text4)">${esc(t)}${d.description?' — '+esc(String(d.description).slice(0,120)):''}</span></label>`;
  const v=val!==undefined?val:(d.default!==undefined&&d.default!==null?d.default:'');
  const en=d.enum||(d.anyOf&&(d.anyOf.find(x=>x.enum)||{}).enum);
  if(en)return`<div style="margin-bottom:8px">${label}<select class="field-input" data-arg="${esc(name)}" data-type="string"><option value=""></option>${en.map(e=>`<option ${String(v)===String(e)?'selected':''}>${esc(e)}</option>`).join('')}</select></div>`;
  if(t==='boolean')return`<div style="margin-bottom:8px">${label}<select class="field-input" data-arg="${esc(name)}" data-type="boolean"><option value=""></option><option ${v===true?'selected':''}>true</option><option ${v===false?'selected':''}>false</option></select></div>`;
  if(t==='object'||t==='array')return`<div style="margin-bottom:8px">${label}<textarea class="field-input" style="min-height:60px;font-family:Consolas,monospace" data-arg="${esc(name)}" data-type="json" placeholder="${t==='array'?'[&quot;a&quot;, &quot;b&quot;]':'{&quot;key&quot;: &quot;value&quot;}'}">${v===''?'':esc(typeof v==='string'?v:JSON.stringify(v))}</textarea></div>`;
  return`<div style="margin-bottom:8px">${label}<input class="field-input" data-arg="${esc(name)}" data-type="${t==='integer'||t==='number'?'number':'string'}" value="${esc(v)}"></div>`;
}
function opsForm(sel){
  const sch=sel.schema||{},props=sch.properties||{},req=new Set(sch.required||[]);
  const names=Object.keys(props).sort((a,b)=>(req.has(b)-req.has(a)));
  if(!names.length)return'<div style="font-size:11px;color:var(--text3)">No inputs.</div>';
  const args=S.ops.args||{};
  const main=names.filter(n=>req.has(n)||names.length<=8),more=names.filter(n=>!main.includes(n));
  return main.map(n=>opsField(n,props[n],req.has(n),args[n])).join('')+(more.length?`<details><summary style="cursor:pointer;font-size:11px;color:var(--text3);margin-bottom:8px">${more.length} optional input(s)</summary>${more.map(n=>opsField(n,props[n],false,args[n])).join('')}</details>`:'');
}
function opsCollectArgs(){
  const args={};
  for(const el of document.querySelectorAll('[data-arg]')){
    const v=el.value.trim();if(v==='')continue;
    const t=el.dataset.type;
    if(t==='number')args[el.dataset.arg]=Number(v);
    else if(t==='boolean')args[el.dataset.arg]=v==='true';
    else if(t==='json'){try{args[el.dataset.arg]=JSON.parse(v);}catch(_){throw new Error(`${el.dataset.arg}: not valid JSON`);}}
    else args[el.dataset.arg]=v;
  }
  return args;
}
async function opsLoadTools(){
  const o=S.ops;
  try{
    if(!o.packages){const p=await (await fetch(API+'/snow/tools/packages')).json();o.packages=p.packages;o.total=p.total_tools;}
    const r=await fetch(`${API}/snow/tools?package=${encodeURIComponent(o.pkg)}&q=${encodeURIComponent(o.toolQ)}`);
    if(!r.ok)throw new Error(await apiErr(r));
    o.tools=(await r.json()).tools;
  }catch(e){o.error=e.message;}
  refresh();
}
async function opsSelectTool(name,args){
  const o=S.ops;o.result=null;o.error='';
  try{const r=await fetch(`${API}/snow/tools/${encodeURIComponent(name)}`);if(!r.ok)throw new Error(await apiErr(r));
    const t=await r.json();o.tool={...t,schema:t.input_schema};o.args=args||{};}catch(e){o.error=e.message;}
  refresh();
}
async function opsRunTool(argsOverride){
  const o=S.ops,sel=o.tool;if(!sel)return;
  let args;try{args=argsOverride||opsCollectArgs();}catch(e){o.error=e.message;refresh();return;}
  o.args=args;
  if(sel.kind==='write'&&!await confirmDialog(`Run ${esc(sel.name)}?`,`<div style="font-size:12px;color:var(--text2);margin-bottom:8px">This changes data in ${esc(S.instanceUrl)} as ${esc(S.username)}.</div><pre style="font-size:11px;background:var(--navy);padding:10px;border-radius:6px;white-space:pre-wrap">${esc(JSON.stringify(args,null,2))}</pre>`))return;
  o.running=true;o.error='';o.result=null;refresh();
  try{const d=await post('/snow/tools/run',{...creds(),name:sel.name,arguments:args,confirm:sel.kind==='write'});o.result=d.result;
    logAudit(`Tool ${sel.name} ${d.success?'succeeded':'returned an error'}`,'',d.success?'success':'warn');}
  catch(e){o.error=e.message;}
  o.running=false;refresh();
}
async function opsAsk(){
  const o=S.ops;if(!o.askQ.trim())return;o.asking=true;o.error='';o.result=null;refresh();
  try{
    const d=await post('/snow/tools/ask',{...creds(),message:o.askQ});
    if(d.mode!=='tool'){o.error=`No tool matched: ${d.reason||''}${d.candidates?` (closest: ${d.candidates.join(', ')})`:''}`;}
    else{
      await opsSelectTool(d.tool,d.arguments);
      if(d.result!==undefined)o.result=d.result;
      else if(d.error)o.error=d.error;
      else if(d.needs_input)o.error=`Fill in: ${d.missing.join(', ')} — then press Run`;
      else if(d.needs_confirmation){o.asking=false;await opsRunTool(d.arguments);return;}
    }
  }catch(e){o.error=e.message;}
  o.asking=false;refresh();
}
function bindOps(q,on){

function detectPriority(t){
  t=t.toLowerCase();
  if(t.includes('critical')||t.includes('ciso')||t.includes('security incident'))return'critical';
  if(t.includes('sla')||t.includes('escalat')||t.includes('breach')||t.includes('incident')||t.includes('war room'))return'high';
  if(t.includes('report')||t.includes('dashboard')||t.includes('survey'))return'medium';
  return'high';
}
function detectModule(t){
  t=t.toLowerCase();
  if(t.includes('incident')||t.includes('change request')||t.includes('problem'))return'ITSM';
  if(t.includes('customer case')||t.includes('csat'))return'CSM';
  if(t.includes('cmdb')||t.includes('configuration item')||t.includes(' ci '))return'ITOM';
  if(t.includes('onboard')||t.includes('offboard')||t.includes('hr case'))return'HRSD';
  if(t.includes('risk')||t.includes('compliance')||t.includes('grc'))return'GRC';
  if(t.includes('vulnerab')||t.includes('threat')||t.includes('ciso'))return'SecOps';
  if(t.includes('asset')||t.includes('hardware')||t.includes('software license'))return'ITAM';
  if(t.includes('catalog')||t.includes('request item'))return'Catalog';
  if(t.includes('work order')||t.includes('field service'))return'FSM';
  return'General';
}

function parseStoriesFromText(raw){
  if(!raw||!raw.trim())return[];
  const stories=[];
  // Split on numbered items, bullets, or double newlines
  const blocks=raw.split(/\n(?=\d+[\.\)]\s)|(?=\n\n)|(?=• )|(?=- As a )/i).filter(b=>b.trim().length>10);
  for(const block of blocks){
    const lines=block.trim().split('\n').filter(l=>l.trim());
    if(!lines.length)continue;
    const storyLine=lines.find(l=>l.match(/\d+[\.\)]\s|As a |I want |so that /i)||l.length>15)||lines[0];
    const storyText=storyLine.replace(/^[\d\.\)\-•*]+\s*/,'').trim();
    if(!storyText||storyText.length<8)continue;
    const acStart=lines.findIndex(l=>l.match(/acceptance criteria|criteria:|ac:|conditions:|given |then |when /i));
    let criteria='';
    if(acStart>0){
      const acLines=lines.slice(acStart+1).filter(l=>l.trim());
      criteria=acLines.map(l=>l.replace(/^[-•*]\s*/,'')).join('\n');
      if(!criteria){criteria=lines[acStart].replace(/acceptance criteria:?|criteria:?/i,'').trim();}
    }else{
      // Check for bullet points after story line
      const bulletLines=lines.slice(1).filter(l=>l.match(/^[-•*]/));
      if(bulletLines.length)criteria=bulletLines.map(l=>l.replace(/^[-•*]\s*/,'')).join('\n');
    }
    const fullText=storyText+' '+criteria;
    stories.push({id:`US-${Date.now()}-${stories.length}`,story:storyText,criteria,priority:detectPriority(fullText),module:detectModule(fullText),status:'parsed'});
  }
  if(stories.length===0){
    // Fallback — each line/paragraph is a story
    const paras=raw.split(/\n\n+/).filter(p=>p.trim().length>8);
    paras.forEach((p,i)=>{
      const line=p.trim().split('\n')[0].replace(/^[\d\.\)\-•*]+\s*/,'').trim();
      if(line.length>8)stories.push({id:`US-${Date.now()}-${i}`,story:line,criteria:p.slice(line.length).trim(),priority:detectPriority(p),module:detectModule(p),status:'parsed'});
    });
  }
  return stories.filter(s=>s.story.length>8);
}

// Send any file to AI backend for extraction
async function extractViaAI(file){
  let token='';try{token=await getToken();}catch(_){}
  const fd=new FormData();fd.append('file',file);
  const r=await fetch(API+'/snow/extract/universal',{
    method:'POST',
    headers:token?{'Authorization':'Bearer '+token}:{},
    body:fd
  });
  if(!r.ok)throw new Error(await apiErr(r));
  return await r.json();
}

function parseAIResponse(data){
  const raw=data.user_stories||data.stories||[];
  return raw.map((s,i)=>{
    const storyText=s.i_want||s.story||s.description||s.title||`Story ${i+1}`;
    const criteriaRaw=s.acceptance_criteria||s.criteria||'';
    const criteriaStr=Array.isArray(criteriaRaw)?criteriaRaw.join('\n'):String(criteriaRaw);
    const priority=String(s.priority||detectPriority(storyText)).toLowerCase().replace(/[^a-z]/g,'');
    return{
      id:`US-${Date.now()}-${i}`,
      sourceId:s.id&&!/^US-\d{3}$/.test(s.id)?s.id:'',description:s.description||'',
      title:s.title||storyText.slice(0,80),story:storyText,as_a:s.as_a||'user',so_that:s.so_that||'',
      criteria:criteriaStr,criteriaInferred:!!s.criteria_inferred,
      priority:['critical','high','medium','low'].includes(priority)?priority:'medium',
      module:s.module||detectModule(storyText),story_type:s.story_type||'story',story_points:s.story_points||3,
      source:'ai',status:'parsed'
    };
  });
}

async function handleFileUpload(file){
  if(!file)return;
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  S.implBusy=true;
  implLog(`Processing ${file.name}…`,'info');
  refresh();
  try{
    if(ext==='xls'){
      // legacy Excel: parse in the browser (the backend reads .xlsx/.csv)
      if(typeof XLSX==='undefined')throw new Error('XLSX library not loaded');
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      const text=rows.map(r=>Object.entries(r).filter(([k,v])=>String(v).trim()).map(([k,v])=>`${k}: ${v}`).join('; ')).join('\n');
      const fd=new FormData();fd.append('text',text);
      const r=await fetch(API+'/snow/extract/universal',{method:'POST',body:fd});
      if(!r.ok)throw new Error(await apiErr(r));
      applyExtraction(await r.json(),'spreadsheet');
    }else{
      const isAudio=['mp3','mp4','wav','m4a','ogg','flac','webm'].includes(ext);
      const isImage=['png','jpg','jpeg','webp','bmp','gif'].includes(ext);
      const label=isAudio?'recording (Whisper transcription)':isImage?'image (vision model)':'file';
      implLog(`Sending ${label} to the agent…`,'info');refresh();
      const data=await extractViaAI(file);
      applyExtraction(data,label);
    }
    if(S.parsedStories.length>0)S.implStep=1;
  }catch(e){
    implLog(`Error: ${e.message}`,'error');
  }finally{
    S.implBusy=false;
    refresh();
  }
}

function applyExtraction(data,label){
  if(data.project_title)S.projectTitle=data.project_title;
  if(data.project_overview)S.projectOverview=data.project_overview;
  const stories=parseAIResponse(data);
  S.parsedStories=[...S.parsedStories,...stories];
  const inferred=stories.filter(s=>s.criteriaInferred).length;
  if(data.source&&String(data.source.mode||'').startsWith('direct')){implLog(`Imported ${stories.length} stories exactly as written from ${data.source.filename} (columns: ${Object.values(data.source.columns||{}).join(', ')}) — no AI rewriting`,'success');return;}
  implLog(`AI extracted ${stories.length} stories from ${label}${inferred?` (${inferred} with AI-inferred acceptance criteria — review them)`:''}${data.truncated?' — input was long; only the first 300,000 characters (about 100 pages) were read':''}`,inferred||data.truncated?'warn':'success');
}

function storyPayloads(){
  return S.parsedStories.map((s,i)=>({
    id:s.sourceId||`US-${String(i+1).padStart(3,'0')}`,summary:(s.title||s.story).slice(0,200),
    description:s.description||`As a ${s.as_a||'user'}, I want ${s.story.replace(/^(as an? .+?, )?i want (to )?/i,'')}${s.so_that?`, so that ${s.so_that}`:''}.`,
    acceptance_criteria:s.criteria?s.criteria.split('\n').filter(l=>l.trim()):['Not provided — to be defined with the product owner.']
  }));
}
function storyTextBlock(){
  return S.parsedStories.map((s,i)=>`${i+1}. ${s.sourceId?s.sourceId+' — ':''}${s.title&&s.title!==s.story?s.title+': ':''}${s.description||s.story}${s.criteria?'\nAcceptance Criteria:\n'+s.criteria:''}`).join('\n\n');

async function generateOneDoc(doc){
  doc.status='generating';doc.error='';refresh();
  implLog(`Generating ${doc.name}…`,'info');
  try{
    const data=await post('/snow/documents/generate',{
      project_name:S.projectTitle||'ServiceNow Implementation',requirements:storyTextBlock(),doc_type:doc.key});
    doc.content=data;doc.status='done';
    implLog(`✅ ${doc.name} ready (${(data.sections||[]).length} sections)`,'success');
  }catch(e){
    doc.status='failed';doc.error=e.message;doc.content=null;
    implLog(`❌ ${doc.name} failed: ${e.message}`,'error');
  }
  refresh();
}

async function generateAllDocuments(){
  S.implBusy=true;
  S.implStep=2;
  S.generatedDocs=DOC_TYPES.map(dt=>({...dt,status:'queued',content:null,error:''}));
  implLog('Starting document generation…','info');
  refresh();
  for(const doc of S.generatedDocs){await generateOneDoc(doc);}
  S.implBusy=false;
  const ok=S.generatedDocs.filter(d=>d.status==='done').length,bad=S.generatedDocs.length-ok;
  implLog(`${ok} of ${S.generatedDocs.length} documents ready${bad?` — ${bad} failed (use Retry)`:''}`,bad?'warn':'success');
  refresh();
}

// Download the document that is on screen (no regeneration)
async function downloadDoc(idx,fmt='docx'){
  const doc=S.generatedDocs[idx];
  if(!doc||doc.status!=='done')return;
  if(doc.key==='USER_STORIES'&&fmt==='xlsx'){await downloadUserStoriesExcel();return;}
  implLog(`Downloading ${doc.name} (.docx)…`,'info');
  try{
    const isStories=doc.key==='USER_STORIES';
    const r=await fetch(API+(isStories?'/snow/documents/export':'/snow/documents/download'),{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(isStories?{doc_type:'USER_STORIES',project_name:S.projectTitle||'ServiceNow Implementation',
        requirements:storyTextBlock(),user_stories:storyPayloads()}:{document:doc.content})
    });
    if(!r.ok)throw new Error(await apiErr(r));
    const blob=await r.blob();
    triggerDownload(blob,`${doc.key}_${(S.projectTitle||'Project').replace(/[^A-Za-z0-9]+/g,'_')}.docx`);
    implLog(`✅ Downloaded ${doc.name}`,'success');
  }catch(e){
    implLog(`❌ Download failed: ${e.message}`,'error');
  }
}

async function downloadUserStoriesExcel(){

function triggerDownload(blob,filename){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);
}

function dlText(text,filename){
  const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  triggerDownload(blob,filename);
}

function showModal(html){
  const old=document.getElementById('_modal');if(old)old.remove();
  const div=document.createElement('div');div.id='_modal';
  div.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:#00000090;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  div.innerHTML=`<div style="background:var(--navy1);border:1px solid var(--border2);border-radius:14px;padding:28px;max-width:560px;width:100%;box-shadow:0 20px 60px #00000080">${html}</div>`;

}

        <button id="_pause" style="flex:1;padding:11px;background:transparent;color:var(--text2);border:1px solid var(--border2);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">⏸ Pause</button>
      </div>`);
    modal.querySelector('#_cont').onclick=()=>{modal.remove();resolve(true);};
    modal.querySelector('#_pause').onclick=()=>{modal.remove();resolve(false);};
  });
}

function detectStoryType(title,description){
  const text=(title+' '+(description||'')).toLowerCase();
  // platform configuration (script include, client script, business rule ...) is a story, never an incident/problem/change
  if(BUILDABLE_RE.test(text)||ARTIFACT_RE.test(text))return'task';
  const incKw=['incident','outage','down','broken','not working','error','failure',
               'disruption','cannot access','unavailable','crash','alert','urgent issue'];
  const probKw=['problem','root cause','rca','recurring','repeated','known error',
                'workaround','underlying','permanent fix','investigation','chronic'];
  const chgKw=['change','upgrade','migration','release','deployment','rollout',
               'patch','update','maintenance','configuration change','change request'];
  const inc=incKw.filter(k=>text.includes(k)).length;
  const prob=probKw.filter(k=>text.includes(k)).length;
  const chg=chgKw.filter(k=>text.includes(k)).length;
  if(inc>prob&&inc>chg)return'incident';
  if(prob>inc&&prob>chg)return'problem';
  if(chg>inc&&chg>prob)return'change';
  return'task';
}

// Mirrors story_build.is_buildable on the server: stories naming platform code also get that code built
const BUILDABLE_RE=/script[\s_-]*include|business[\s_-]*rule|client[\s_-]*script|ui[\s_-]*polic|glide[\s_-]*ajax|abstractajaxprocessor|class\.create|server[\s-]*side (?:script|logic|function|class)|reusable (?:server|script|function|class|utility)|utility class|\bon(?:load|change|submit)\b/i;
function isBuildableStory(s){return BUILDABLE_RE.test([s.title,s.story,s.so_that,s.description,s.criteria].filter(Boolean).join(' '));}
// Configuration artifacts the AI Agent chat builds through the requirement pipeline; a message that starts like a
// question or a look-up ("list client scripts", "what is a script include") is not a build request.
const ARTIFACT_RE=/\b(script[\s_-]*includes?|client[\s_-]*scripts?|business[\s_-]*rules?|ui[\s_-]*polic(y|ies)|data[\s_-]*polic(y|ies)|glide[\s_-]*ajax)\b/i;
const ARTIFACT_QUERY_RE=/^\s*(list|show|find|get|fetch|search|count|how many|what|which|why|how|explain|describe|tell me|is there|are there|does|do i|can i|help)\b/i;
const ARTIFACT_ICON={created:'✅',reused:'♻️',skipped:'⏭️',warning:'⚠️',failed:'❌'};
function renderStoryBuild(b){
  if(!b)return'';
  const ok=b.status!=='failed';
  return`<div style="margin-top:6px;padding:8px 10px;background:var(--navy3);border-radius:6px;border-left:3px solid ${ok?'var(--green)':'var(--red)'}">
    <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px">🧩 Built artifacts${b.update_set?` · <a href="${esc(b.update_set.link||'#')}" target="_blank" style="color:var(--cyan);text-decoration:none">${esc(b.update_set.name||'update set')} ↗</a>`:''}</div>
    ${(b.artifacts||[]).map(a=>`<div style="font-size:11px;color:var(--text2);line-height:1.6">${ARTIFACT_ICON[a.status]||'•'} ${esc(a.kind)}: ${a.link?`<a href="${esc(a.link)}" target="_blank" style="color:var(--cyan);text-decoration:none"><strong>${esc(a.name)}</strong> ↗</a>`:`<strong>${esc(a.name)}</strong>`} <span style="color:var(--text4)">${esc(a.status)}${a.message?' — '+esc(a.message):''}</span></div>`).join('')}
    ${!ok?`<div style="font-size:11px;color:var(--red);margin-top:3px">⚠ ${esc(b.error||'Build failed')}${(b.issues||[]).length?': '+esc(b.issues.join('; ')):''}</div>`:''}
    ${b.notes?`<div style="font-size:11px;color:var(--text3);margin-top:3px">ℹ️ ${esc(b.notes)}</div>`:''}
  </div>`;
}

// Requirement pipeline report (plan → confirm → deploy → verify). Built only from the server's report.
const REQ_STATUS={read_only:['Look-up only','var(--text3)'],needs_input:['Needs your input','var(--amber)'],
  needs_decision:['Needs your decision','var(--amber)'],awaiting_confirmation:['Awaiting confirmation','var(--cyan)'],
  already_satisfied:['Already satisfied','var(--green)'],blocked:['Blocked','var(--red)'],plan_changed:['Plan changed — review','var(--amber)'],
  deployed:['Deployed','var(--green)'],partially_completed:['Partially completed','var(--amber)'],failed:['Failed','var(--red)'],nothing_to_do:['Nothing to do','var(--text3)']};
function renderReqReport(plan,ctx){
  if(!plan||!plan.report)return'';
  const r=plan.report,st=r.deployment.status,[label,color]=REQ_STATUS[st]||[st,'var(--text3)'];
  const im=r.implementation||{},q=r.requirement||{},ins=r.inspection||{},v=r.verification||{},pc=v.persisted_config||{};
  const sec=(t,body)=>body?`<div style="margin-top:8px"><div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px">${t}</div>${body}</div>`:'';
  const line=s=>`<div style="font-size:11px;color:var(--text2);line-height:1.6">${s}</div>`;
  const ex=it=>(it.existing||[]).length?` <span style="color:var(--text4)">· existing: ${it.existing.map(x=>esc(`${(x.kind||'').replace(/_/g,' ')} '${x.name||x.sys_id}'${x.active===false?' (inactive)':''}${x.why?' — '+x.why:''}${x.origin&&x.origin.summary?' [from requirement: '+x.origin.summary+']':''}`)).join('; ')}</span>`:'';
  const item=(icon,it,extra)=>line(`${icon} <strong>${esc((it.mechanism||'').replace(/_/g,' '))}</strong> ${it.name?`'${esc(it.name)}'`:''}${it.trigger?` <span style="color:var(--text4)">(${esc(it.trigger)})</span>`:''} — ${esc(it.reason)}${extra||''}${ex(it)}`);
  const req=[line(`<strong>${esc(q.summary||'')}</strong>${q.table?` · table <code>${esc(q.table)}</code>`:''}`),
    ...(q.effects||[]).map(e=>line(`• ${esc(e.field)} ${esc(e.effect)}=${esc(e.display_value||e.value)} <span style="color:var(--text4)">(${esc(e.side)}${e.condition?' · when '+esc(e.condition):''})</span>`)),
    ...(q.logic||[]).map(l=>line(`• logic (${esc(l.side)}${l.client_type?' '+esc(l.client_type):''}): ${esc(l.description)}`)),
    (q.assumptions||[]).length?line(`<span style="color:var(--text3)">Assumed: ${esc(q.assumptions.join(' · '))}</span>`):'',
    (q.missing_information||[]).length?`<div class="warn-box" style="margin-top:4px;font-size:11px">❓ ${q.missing_information.map(esc).join('<br>❓ ')}</div>`:''].join('');
  const cnt=ins.counts||{},notes=(ins.notes||[]).map(n=>esc(`${n.what}: ${n.kind}${n.detail?' — '+n.detail:''}`));
  const insp=ins.tables?[line(`Looked at ${esc((ins.tables||[]).join(' → '))}: ${Object.entries(cnt).filter(([k,n])=>n).map(([k,n])=>`${n} ${k.replace(/_/g,' ')}`).join(', ')||'no existing rules or policies'}`),
    notes.length?line(`⚠️ ${notes.join('<br>⚠️ ')}`):'',(ins.not_inspected||[]).length?line(`<span style="color:var(--text4)">Not inspected: ${esc(ins.not_inspected.join('; '))}</span>`):'',
    (ins.previous_requirements||[]).length?line(`Earlier requirements on this table: ${ins.previous_requirements.map(h=>esc(`${h.summary} (${h.status})`)).join('; ')}`):''].join(''):'';
  const decide=it=>`<select class="field-input" data-req-dec="${esc(plan.plan_id)}|${esc(it.id)}" style="display:inline-block;width:auto;padding:2px 6px;font-size:11px;margin-left:6px"><option value="">— decide —</option>${(it.options||[]).map(o=>`<option value="${esc(o)}">${esc({create:'create new',reuse:'rely on existing',modify:'modify existing',skip:'skip'}[o]||o)}</option>`).join('')}</select>`;
  const impl=[...(im.already_satisfied||[]).map(it=>item('♻️',it)),...(im.to_create||[]).map(it=>item('➕',it,it.side?` <span style="color:var(--text4)">[${esc(it.side)}]</span>`:'')),
    ...(im.to_modify||[]).map(it=>item('✏️',it,it.changes?` <span style="color:var(--text4)">changes ${esc(JSON.stringify(it.changes))}</span>`:'')),
    ...(im.needs_decision||[]).map(it=>item('❓',it,st==='needs_decision'||st==='plan_changed'?decide(it):'')),
    ...(im.blocked||[]).map(it=>item('⛔',it,` <span style="color:var(--red)">[${esc(it.kind)}]</span>`)),...(im.skipped||[]).map(it=>item('⏭️',it))].join('');
  const dep=r.deployment||{};
  const depl=(dep.records||[]).length||dep.error?[...(dep.records||[]).map(x=>line(`${ARTIFACT_ICON[x.status]||(x.status==='modified'?'✏️':'•')} ${esc(x.kind)}: <strong>${esc(x.name)}</strong> <span style="color:var(--text4)">${esc(x.status)}${x.message?' — '+esc(x.message):''}</span>`)),

    (dep.rolled_back||[]).length?line(`↩️ Rolled back ${dep.rolled_back.filter(x=>x.ok).length}/${dep.rolled_back.length} change(s)`):''].join(''):'';
  const fails=(pc.checks||[]).filter(c=>!c.passed);
  const acEvidence=v.acceptance_criteria||[];
  const verif=(pc.checks||[]).length||acEvidence.length||st==='deployed'||st==='partially_completed'?[line(`🔎 Stored configuration (read back): <strong style="color:${pc.failed?'var(--amber)':'var(--green)'}">${pc.passed||0} passed, ${pc.failed||0} failed</strong>`),
    ...fails.map(c=>line(`❌ ${esc(c.check)}${c.detail?' — '+esc(c.detail):''}`)),
    ...acEvidence.map(a=>line(`🧪 ${esc(a.test_id)} · ${esc(a.status.replace(/_/g,' '))}: ${esc(a.criterion)} <span style="color:var(--text4)">— ${esc(a.reason||'')}</span>`)),
    line(`🧪 Runtime test: <strong>${esc(((v.runtime||{}).status||'not_run').replace(/_/g,' '))}</strong> <span style="color:var(--text4)">— ${esc((v.runtime||{}).reason||'')}</span>`)].join(''):'';
  const canDeploy=['awaiting_confirmation','needs_decision','plan_changed'].includes(st);
  return`<div style="margin-top:6px;padding:10px 12px;background:var(--navy3);border-radius:6px;border-left:3px solid ${color}">

    ${sec('Requirement understood',req)}${sec('Configuration inspection',insp)}${sec('Implementation',impl)}${sec('Deployment',depl)}${sec('Verification',verif)}
    ${sec('Outcome',line(esc(r.outcome||'')))}
    ${canDeploy?`<div style="margin-top:10px"><button class="btn btn-primary btn-sm" data-req-deploy="${esc(plan.plan_id)}" data-req-ctx="${esc(ctx||'impl')}" ${S.reqBusy?'disabled':''}>${S.reqBusy===plan.plan_id?'<span class="spinning">⟳</span> Building…':'✅ Confirm & build'}</button> <span style="font-size:10px;color:var(--text4)">Nothing is written to ServiceNow until you confirm.</span></div>`:''}
  </div>`;
}

async function deployRequirement(planId,ctx){
  const plan=S.reqPlans[planId];if(!plan||S.reqBusy)return;
  const readiness=await refreshPlannerPreflight();
  if(!readiness||!readiness.execution_ready){
    const reasons=(readiness&&readiness.blockers)||[readiness?.error||'Planner readiness could not be verified'];
    await confirmDialog('Planner execution blocked',`<div style="font-size:12px">${reasons.map(esc).join('<br>')}</div>`);
    return;
  }
  const decisions={};
  document.querySelectorAll('[data-req-dec]').forEach(el=>{const [pid,iid]=el.dataset.reqDec.split('|');if(pid===planId&&el.value)decisions[iid]=el.value;});
  const open=(plan.report.implementation.needs_decision||[]).filter(it=>!decisions[it.id]);
  if(open.length){await confirmDialog('Decisions needed',`<div style="font-size:12px">Choose what to do for: ${open.map(it=>esc(it.id)).join(', ')} — nothing was changed.</div>`);return;}
  const im=plan.report.implementation;
  const n=(im.to_create||[]).length+(im.to_modify||[]).length+Object.values(decisions).filter(d=>d==='create'||d==='modify').length;
  const ok=await confirmDialog('Implement this requirement?',`<div style="font-size:12px;color:var(--text2)">${esc(plan.report.requirement.summary)}</div><div style="font-size:12px;margin-top:6px">${n} change(s) will be written to ServiceNow as ${esc(S.username)}, in an update set, then read back to verify.</div>${Object.keys(decisions).length?`<pre style="font-size:11px;background:var(--navy);padding:8px;border-radius:6px">${esc(JSON.stringify(decisions,null,1))}</pre>`:''}`);
  if(!ok)return;
  S.reqBusy=planId;refresh();
  try{
    let res;
    if(ctx==='mcp'){
      const r=await post('/snow/mcp/chat',{...creds(),confirm:{tool:'snow_implement_requirement',arguments:{plan_id:planId,decisions,require_preflight:true}}});
      res=r.result||{};
      if(res.success===false&&!res.report)throw new Error(res.error||'implementation failed');
    }else{
      res=await post('/snow/requirements/deploy',{...creds(),plan_id:planId,confirm:true,decisions,require_preflight:true});
    }
    S.reqPlans[planId]=res;if(res.plan_id&&res.plan_id!==planId)S.reqPlans[res.plan_id]=res;
    logAudit(`Requirement ${planId}: ${res.status}`,'requirement pipeline',res.status==='deployed'?'success':res.status==='failed'?'error':'warn');
  }catch(e){
    logAudit(`Requirement ${planId} not deployed: ${e.message}`,'','error');
    await confirmDialog('Not deployed',`<div style="font-size:12px">${esc(e.message)}</div>`);
  }finally{S.reqBusy=false;refresh();}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-req-deploy]');if(b){e.preventDefault();deployRequirement(b.dataset.reqDeploy,b.dataset.reqCtx);}});

const STORY_TYPE_LABEL={incident:'🚨 INC',problem:'🔴 PRB',change:'🔄 CHG',task:'📋 STORY',story:'📋 STORY'};
const STORY_TYPE_COLOR={incident:'var(--red)',problem:'#c084fc',change:'var(--amber)',task:'var(--blue3)',story:'var(--blue3)'};

async function deploySingleStory(idx){
  const s=S.parsedStories[idx];
  if(!s)return;
  if(!S.deployResults[idx])S.deployResults[idx]={};

  const approved=await showApprovalDialog(s);
  if(!approved){
    S.deployResults[idx]={status:'skipped'};
    implLog(`Skipped story ${idx+1}: ${s.story.slice(0,50)}…`,'warn');
    refresh();
    return;
  }

  S.deployResults[idx]={status:'running'};
  S.implBusy=true;
  refresh();
  implLog(`Deploying story ${idx+1}: ${s.story.slice(0,60)}…`,'info');

  try{
    const criteriaList=s.criteria?String(s.criteria).split('\n').filter(l=>l.trim()):[];
    const stype=isBuildableStory(s)?'story':s.story_type&&s.story_type!=='story'?s.story_type:(detectStoryType(s.story,s.criteria||'')==='task'?'story':detectStoryType(s.story,s.criteria||''));
    const data=await post('/snow/stories/approve-and-deploy',{...creds(),approved:true,pipeline:true,require_preflight:true,user_stories:[{
      id:s.sourceId||undefined,description:s.description||undefined,
      title:(s.title||s.story).slice(0,160),as_a:s.as_a||'user',i_want:s.story,so_that:s.so_that||'',
      acceptance_criteria:criteriaList,priority:s.priority||'medium',module:s.module||'Platform',
      story_points:s.story_points||3,story_type:stype}]});
    const c=(data.stories_created||[]).find(x=>x.index===0);
    if(!c)throw new Error((data.errors&&data.errors[0]&&data.errors[0].error)||'ServiceNow returned no record');
    S.deployResults[idx]={status:'deployed',sys_id:c.sys_id,table:c.table,number:c.number,assignment_group:c.assignment_group,story_type:c.story_type,link:c.link,build:c.build||null,reqPlanId:c.requirement_plan?c.requirement_plan.plan_id:null,reqError:c.requirement_plan_error||''};
    if(c.requirement_plan){S.reqPlans[c.requirement_plan.plan_id]=c.requirement_plan;implLog(`🧭 Story ${idx+1}: requirement planned — ${(REQ_STATUS[c.requirement_plan.status]||[c.requirement_plan.status])[0]} (review and confirm it in the story row)`,'info');}
    if(c.requirement_plan_error)implLog(`⚠️ Story ${idx+1}: requirement could not be planned — ${c.requirement_plan_error}`,'warn');
    implLog(`✅ Story ${idx+1} → ${c.table} ${c.number||c.sys_id}${c.assignment_group?' ('+c.assignment_group+')':''}`,'success');
    if(c.build){
      const b=c.build;
      (b.artifacts||[]).forEach(a=>implLog(`${ARTIFACT_ICON[a.status]||'•'} ${a.kind}: ${a.name} — ${a.status}${a.message?' ('+a.message+')':''}`,a.status==='failed'?'error':a.status==='created'||a.status==='reused'?'success':'warn'));
      if(b.status==='failed')implLog(`❌ Story ${idx+1} artifacts not built: ${b.error||'build failed'}${(b.issues||[]).length?' — '+b.issues.join('; '):''}`,'error');
      else implLog(`🧩 Story ${idx+1} artifacts built (${b.status.replace(/_/g,' ')})${b.update_set?' in update set '+b.update_set.name:''}`,'success');
      if(b.notes)implLog(`ℹ️ ${b.notes}`,'info');
    }
  }catch(e){
    S.deployResults[idx]={status:'failed',error:e.message};
    implLog(`❌ Story ${idx+1} failed: ${e.message}`,'error');
  }finally{
    S.implBusy=false;
    refresh();
  }
}

async function deployAll(){
  S.implBusy=true;
  implLog(`Starting bulk deployment of ${S.parsedStories.length} stories…`,'info');
  if(!S.deployResults.length)S.deployResults=S.parsedStories.map(()=>({}));
  refresh();

  let stopped=false;
  for(let i=0;i<S.parsedStories.length;i++){
    if(stopped)break;
    const r=S.deployResults[i];
    if(r&&r.status==='deployed')continue;
    await deploySingleStory(i);
    // After each (except last), ask to continue
    if(i<S.parsedStories.length-1&&!stopped){
      const done=S.deployResults.filter(r=>r&&r.status==='deployed').length;
      const cont=await showContinueDialog(i+1,S.parsedStories.length,done);
      if(!cont){stopped=true;implLog('Deployment paused by user','warn');}
    }
  }
  S.implBusy=false;
  const done=S.deployResults.filter(r=>r&&r.status==='deployed').length;
  implLog(`Deployment ${stopped?'paused':'complete'}: ${done}/${S.parsedStories.length} deployed`,'success');
  refresh();
}
