// ════════════════════════════════════════════════════════════════════════════
// BIND
// ════════════════════════════════════════════════════════════════════════════
function bind(){
  const q=id=>document.getElementById(id);
  const on=(id,fn)=>{const el=q(id);if(el)el.onclick=fn;};

  // Connect
  on('btn-connect',doConnect);
  on('btn-toggle-pass',()=>{
    const pEl=q('f-pass');
    // Save current value before re-render so user doesn't lose what they typed
    if(pEl)S.password=pEl.value;
    S.showPass=!S.showPass;
    rAll();
    // Restore focus to password field and move cursor to end
    const p2=q('f-pass');if(p2){const v=p2.value;p2.value='';p2.value=v;p2.focus();}
  });
  on('btn-debug-login',async()=>{
    const uEl=q('f-url'),uuEl=q('f-user'),pEl=q('f-pass');
    let url=((S.agentCfg&&S.agentCfg.instance_url)||(uEl?uEl.value.trim():'')||S.instanceUrl||'').trim().replace(/\/+$/,'');
    if(!url.startsWith('http'))url='https://'+url;
    try{const u=new URL(url);url=u.protocol+'//'+u.host;}catch(_){}   // host keeps a non-default port
    const user=(uuEl?uuEl.value.trim():S.username);
    const pass=pEl?pEl.value:S.password;
    if(!url||!user||!pass){S.connError='Fill in all three fields first';rAll();return;}
    S.debugResult={testing:'Running test...'};rAll();
    try{
      const r=await post('/snow/debug-login',{snow_url:url,snow_user:user,snow_pass:pass});
      S.debugResult=r;
    }catch(e){S.debugResult={error:e.message};}
    rAll();
  });
  if(!S.agentCfg&&!S.connected){S.agentCfg={};fetch(API+'/snow/config').then(r=>r.ok?r.json():null)
    .then(c=>{S.agentCfg={...(c||{}),loaded:true};if(!S.connected)rAll();})
    .catch(()=>{S.agentCfg={loaded:true};if(!S.connected)rAll();});}
  ['f-url','f-user','f-pass','f-key'].forEach(id=>{const el=q(id);if(el)el.onkeydown=e=>{if(e.key==='Enter')doConnect();};});
  on('f-change-inst',e=>{if(e)e.preventDefault();S.changeInstance=true;rAll();});

  // Nav
  document.querySelectorAll('[data-nav]').forEach(el=>{el.onclick=()=>{S.activeSection=el.dataset.nav;refresh();
    if(S.activeSection==='updatesets'&&!S.us.list.length&&!S.us.loading)usRefresh();
    if(S.activeSection==='ops'&&S.ops.tab==='approvals'&&!S.ops.approvals)opsApprovalsLoad();
    if(S.activeSection==='ops'&&S.ops.tab==='tools'&&!S.ops.tools)opsLoadTools();
    };});

  // User Management
  on('ur-open-btn',()=>{UR_STATE.createForm.open=true;UR_STATE.created=null;UR_STATE.error='';refresh();});
  on('ur-cancel-btn',()=>{UR_STATE.createForm.open=false;UR_STATE.error='';refresh();});
  on('ur-search-btn',()=>{
    UR_STATE.search=q('ur-search')||'';
    UR_STATE.filterDept=q('ur-filter-dept')||'';
    UR_STATE.filterActive=q('ur-filter-active')||'';
    urLoad();
  });
  on('ur-create-btn',()=>{
    UR_STATE.createForm.firstName=q('ur-fn')||'';
    UR_STATE.createForm.lastName=q('ur-ln')||'';
    UR_STATE.createForm.email=q('ur-email')||'';
    UR_STATE.createForm.userName=q('ur-uname')||'';
    UR_STATE.createForm.title=q('ur-title')||'';
    UR_STATE.createForm.dept=q('ur-dept')||'';
    UR_STATE.createForm.phone=q('ur-phone')||'';
    urCreate();
  });
  on('ur-close-detail',()=>{UR_STATE.viewUser=null;UR_STATE.viewGroups=null;refresh();});
  document.querySelectorAll('[data-ur-view]').forEach(btn=>{
    btn.onclick=()=>urViewUser(btn.dataset.urView,btn.dataset.urUname);
  });

  // Disconnect
  on('btn-disconnect',doDisconnect);
  on('btn-disconnect-confirm',doDisconnect);

  // Settings
  on('btn-save-settings',async()=>{
    const u=q('s-url'),uu=q('s-user'),p=q('s-pass'),k=q('s-key');
    const old={url:S.instanceUrl,user:S.username,pass:S.password,key:S.apiKey};
    if(u)S.instanceUrl=u.value.trim();if(uu)S.username=uu.value.trim();if(p)S.password=p.value;if(k)S.apiKey=k.value.trim();
    try{S.login=await post('/snow/login',creds());rememberLogin();logAudit(`Signed in as ${S.username}`,'','success');alert('Saved — credentials verified with ServiceNow.');}
    catch(e){Object.assign(S,{instanceUrl:old.url,username:old.user,password:old.pass,apiKey:old.key});logAudit(`Settings not saved: ${e.message}`,'','error');alert('Not saved: '+e.message);}
    refresh();
  });

  // Input tabs
  on('tab-text',()=>{S.inputTab='text';refresh();});
  on('tab-file',()=>{S.inputTab='file';refresh();});
  on('btn-planner-preflight',()=>refreshPlannerPreflight());

  // Story textarea
  const ta=q('story-input');if(ta)ta.oninput=e=>{S.userStoriesInput=e.target.value;};

  // Parse stories from text
  on('btn-parse',()=>{
    const ta=q('story-input');
    const text=(ta?ta.value:S.userStoriesInput).trim();
    if(!text){implLog('Please enter some requirements first','warn');return;}
    S.userStoriesInput=text;
    // Try AI extraction via text input
    S.implBusy=true;implLog('Parsing requirements…','info');refresh();
    (async()=>{
      try{
        let token='';try{token=await getToken();}catch(_){}
        const fd=new FormData();fd.append('text',text);
        const r=await fetch(API+'/snow/extract/universal',{
          method:'POST',
          headers:token?{'Authorization':'Bearer '+token}:{},
          body:fd
        });
        if(!r.ok)throw new Error(await apiErr(r));
        applyExtraction(await r.json(),'text');
      }catch(e){
        const stories=parseStoriesFromText(text).map(x=>({...x,source:'local'}));
        S.parsedStories=[...S.parsedStories,...stories];
        implLog(`⚠ AI extraction failed (${e.message}). Used the basic local parser instead: ${stories.length} stories — priorities/modules are keyword guesses, review before deploying.`,'warn');
      }
      if(S.parsedStories.length>0)S.implStep=1;
      S.implBusy=false;refresh();
    })();
  });

  // File upload
  const fi=q('file-input');if(fi)fi.onchange=e=>{if(e.target.files[0])handleFileUpload(e.target.files[0]);};
  const dz=q('dropzone');
  if(dz){
    dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag');};
    dz.ondragleave=()=>dz.classList.remove('drag');
    dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drag');if(e.dataTransfer.files[0])handleFileUpload(e.dataTransfer.files[0]);};
  }

  // Step nav
  on('btn-back-0',()=>{S.implStep=0;refresh();});
  on('btn-dl-stories-word',downloadUserStoriesWord);
  on('btn-dl-stories-xlsx',downloadUserStoriesExcel);
  on('btn-back-1',()=>{S.implStep=1;refresh();});
  on('btn-back-2',()=>{S.implStep=2;refresh();});
  on('btn-add-story',()=>{
    const t=prompt('Enter user story:');
    if(t&&t.trim())S.parsedStories.push({id:`US-${Date.now()}`,story:t.trim(),criteria:'',priority:'medium',module:'General',status:'parsed'});
    refresh();
  });
  document.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.onclick=()=>{S.parsedStories.splice(parseInt(btn.dataset.remove),1);if(!S.parsedStories.length)S.implStep=0;refresh();};
  });

  // Generate docs
  on('btn-gen-docs',()=>generateAllDocuments());
  on('btn-regen',()=>generateAllDocuments());

  // Download docs
  document.querySelectorAll('[data-retry]').forEach(btn=>{btn.onclick=async()=>{S.implBusy=true;await generateOneDoc(S.generatedDocs[parseInt(btn.dataset.retry)]);S.implBusy=false;refresh();};});
  document.querySelectorAll('[data-dl]').forEach(btn=>{btn.onclick=()=>downloadDoc(parseInt(btn.dataset.dl),btn.dataset.fmt||'docx');});

  // Go to deploy
  on('btn-go-deploy',()=>{
    S.implStep=3;
    if(!S.deployResults.length)S.deployResults=S.parsedStories.map(()=>({}));
    refresh();
  });

  // Deploy
  on('btn-deploy-all',deployAll);
  document.querySelectorAll('[data-deploy]').forEach(btn=>{btn.onclick=()=>deploySingleStory(parseInt(btn.dataset.deploy));});
  on('btn-restart',()=>{
    if(!confirm('Start over? This clears all stories and results.'))return;
    Object.assign(S,{implStep:0,implBusy:false,userStoriesInput:'',parsedStories:[],generatedDocs:[],deployResults:[],implLog:[],projectTitle:'',projectOverview:'',inputTab:'text'});
    refresh();
  });

  // Logs
  on('btn-clear-log',()=>{S.implLog=[];refresh();});
  on('btn-clear-audit',()=>{S.auditLog=[];refresh();});

  // Health scan
  on('btn-run-scan',runHealthScan);
  bindBuildAndUpdateSets(q,on);
  bindOps(q,on);

  // Chat
  on('btn-chat-send',()=>sendChat());
  const ci=q('chat-input');
  if(ci){
    ci.oninput=e=>{S.chatInput=e.target.value;};
    // Auto-resize textarea
    ci.oninput=e=>{S.chatInput=e.target.value;ci.style.height='auto';ci.style.height=Math.min(ci.scrollHeight,120)+'px';};
    ci.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}};
  }
  // Quick action chips
  document.querySelectorAll('[data-quick]').forEach(el=>{el.onclick=()=>sendChat(el.dataset.quick);});
  // Inline action buttons inside agent bubbles
  document.querySelectorAll('.chat-action[data-cmd]').forEach(el=>{el.onclick=()=>sendChat(el.dataset.cmd);});
  // Clear chat
  on('btn-clear-chat',()=>{S.chatMessages=[];refresh();});
  // Navigate to implement from chat
  on('btn-go-impl',()=>{S.activeSection='implement';refresh();});

  // MCP chat
  on('btn-mcp-chat-send',()=>sendMcpChat());
  const mcpInput=q('mcp-chat-input');
  if(mcpInput){
    mcpInput.oninput=e=>{S.mcpInput=e.target.value;mcpInput.style.height='auto';mcpInput.style.height=Math.min(mcpInput.scrollHeight,120)+'px';};
    mcpInput.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMcpChat();}};
  }
  document.querySelectorAll('[data-mcp-quick]').forEach(el=>{el.onclick=()=>sendMcpChat(el.dataset.mcpQuick);});
  on('btn-clear-mcp-chat',()=>{S.mcpMessages=[];refresh();});

  // ── ACC Deployment bindings ──────────────────────────────────────────────
  // Tab switching
  document.querySelectorAll('[data-acc-tab]').forEach(btn=>{
    btn.onclick=()=>{S.acc.tab=btn.dataset.accTab;S.acc.gatesBriefing=null;refresh();};
  });

  // Generate package — tab switches
  on('acc-gen-tab-text',()=>{S.acc.genInputTab='text';refresh();});
  on('acc-gen-tab-file',()=>{S.acc.genInputTab='file';refresh();});

  // Text area
  const accTa=q('acc-gen-text');
  if(accTa){
    accTa.oninput=e=>{S.acc.genText=e.target.value;};
    accTa.onchange=e=>{S.acc.genText=e.target.value;};
    accTa.onpaste=e=>{setTimeout(()=>{S.acc.genText=accTa.value;},0);};
  }

  // File drop zone
  const accDz=q('acc-gen-dropzone');
  if(accDz){
    accDz.onclick=()=>q('acc-gen-file')&&q('acc-gen-file').click();
    accDz.ondragover=e=>{e.preventDefault();accDz.classList.add('drag');};
    accDz.ondragleave=()=>accDz.classList.remove('drag');
    accDz.ondrop=e=>{e.preventDefault();accDz.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)accReadFile(f);};
    const fi=q('acc-gen-file');if(fi)fi.onchange=e=>{if(e.target.files[0])accReadFile(e.target.files[0]);};
  }

  // Load default program as text
  on('acc-btn-default-prog',async()=>{
    try{const r=await fetch(API+'/snow/acc/default-program');if(!r.ok)throw new Error(await apiErr(r));
      const d=await r.json();S.acc.genText=JSON.stringify(d,null,2);S.acc.genInputTab='text';refresh();}
    catch(e){alert('Could not load default program: '+e.message);}
  });

  // Generate
  on('acc-btn-generate',async()=>{
    // Always read textarea directly at click time — catches paste without oninput
    const ta=q('acc-gen-text');if(ta)S.acc.genText=ta.value;
    const text=S.acc.genText.trim();if(!text){S.acc.genError='Please paste or type a specification first.';refresh();return;}
    S.acc.genError='';S.acc.genJobId='';S.acc.genStatus={status:'running',pct:5,progress:'Submitting…'};refresh();
    try{
      const r=await post('/snow/acc/generate',{source:text});
      S.acc.genJobId=r.job_id;
      accPollJob(r.job_id);
    }catch(e){S.acc.genError=e.message;S.acc.genStatus=null;refresh();}
  });

  // Setup
  const setupAppNameEl=q('acc-setup-appname');if(setupAppNameEl)setupAppNameEl.oninput=e=>{S.acc.setupAppName=e.target.value;};
  const setupCmdbEl=q('acc-setup-cmdb');if(setupCmdbEl)setupCmdbEl.onchange=e=>{S.acc.setupIncludeCmdb=e.target.checked;};
  on('acc-btn-setup',async()=>{
    S.acc.setupBusy=true;S.acc.setupError='';S.acc.setupResult=null;refresh();
    try{
      const n=q('acc-setup-appname');if(n)S.acc.setupAppName=n.value.trim();
      const r=await post('/snow/acc/setup',{...creds(),app_name:S.acc.setupAppName,include_cmdb:S.acc.setupIncludeCmdb});
      S.acc.setupResult=r;logAudit('ACC Setup complete','','success');
    }catch(e){S.acc.setupError=e.message;logAudit('ACC Setup failed: '+e.message,'','error');}
    S.acc.setupBusy=false;refresh();
  });

  // Seed
  on('acc-btn-seed',async()=>{
    S.acc.seedBusy=true;S.acc.seedError='';S.acc.seedResult=null;refresh();
    try{
      const prog=S.acc.genStatus&&S.acc.genStatus.program;
      const r=await post('/snow/acc/seed',{...creds(),...(prog?{program:prog}:{})});
      S.acc.seedResult=r;logAudit('ACC Seed complete','','success');
    }catch(e){S.acc.seedError=e.message;logAudit('ACC Seed failed: '+e.message,'','error');}
    S.acc.seedBusy=false;refresh();
  });

  // Command center
  on('acc-btn-cc',async()=>{
    const el=q('acc-cc-target');if(el)S.acc.ccTarget=el.value.trim();
    S.acc.ccBusy=true;S.acc.ccError='';refresh();
    try{
      const body={...creds()};if(S.acc.ccTarget)body.target_override=parseInt(S.acc.ccTarget)||undefined;
      S.acc.ccData=await post('/snow/acc/command-center',body);
      logAudit('ACC Command Center refreshed','','success');
    }catch(e){S.acc.ccError=e.message;}
    S.acc.ccBusy=false;refresh();
  });

  // Wave: select from list
  document.querySelectorAll('[data-select-wave]').forEach(el=>{
    el.onclick=()=>{S.acc.selectedWave=el.dataset.selectWave;const inp=q('acc-wave-id');if(inp)inp.value=S.acc.selectedWave;refresh();};
  });
  const waveIdEl=q('acc-wave-id');if(waveIdEl)waveIdEl.oninput=e=>{S.acc.selectedWave=e.target.value.trim();};
  const waveDepEl=q('acc-wave-deployed');if(waveDepEl)waveDepEl.oninput=e=>{S.acc.waveDeployed=e.target.value;};

  on('acc-btn-wave-update',async()=>{
    const id=q('acc-wave-id')&&q('acc-wave-id').value.trim();
    const status=q('acc-wave-status')&&q('acc-wave-status').value;
    const dep=q('acc-wave-deployed')&&q('acc-wave-deployed').value;
    if(!id){alert('Enter a Wave ID');return;}
    if(!status){alert('Select a status');return;}
    S.acc.waveUpdateBusy=true;S.acc.wavesError='';refresh();
    try{
      const body={...creds(),wave_id:id,status};if(dep)body.deployed_endpoints=parseInt(dep);
      const r=await post('/snow/acc/wave/update',body);
      logAudit(`Wave ${id} → ${status}`,'','success');alert('Wave updated: '+(r.message||'OK'));
    }catch(e){S.acc.wavesError=e.message;logAudit('Wave update failed: '+e.message,'','error');}
    S.acc.waveUpdateBusy=false;refresh();
  });

  // AI Briefing (waves tab)
  on('acc-btn-briefing',async()=>{
    S.acc.gatesBriefBusy=true;S.acc.gatesBriefing=null;refresh();
    try{
      const r=await post('/snow/acc/briefing',{...creds(),...(S.acc.ccData?{kpis:S.acc.ccData}:{})});
      S.acc.gatesBriefing=r.briefing||r.message||JSON.stringify(r);
    }catch(e){S.acc.gatesBriefing='Error: '+e.message;}
    S.acc.gatesBriefBusy=false;refresh();
  });

  // Gate select
  document.querySelectorAll('[data-select-gate]').forEach(el=>{
    el.onclick=()=>{S.acc.selectedGate=el.dataset.selectGate;S.acc.gateDecideResult=null;S.acc.gateDecideError='';S.acc.gatesBriefing=null;refresh();};
  });

  // Gate advisory
  on('acc-btn-gate-recommend',async()=>{
    if(!S.acc.selectedGate)return;
    S.acc.gatesBriefBusy=true;S.acc.gatesBriefing=null;refresh();
    try{
      const r=await post('/snow/acc/gate/recommend',{...creds(),gate_id:S.acc.selectedGate,...(S.acc.ccData?{kpis:S.acc.ccData}:{})});
      S.acc.gatesBriefing=r.recommendation||r.message||JSON.stringify(r);
    }catch(e){S.acc.gatesBriefing='Error: '+e.message;}
    S.acc.gatesBriefBusy=false;refresh();
  });

  // Gate decision GO / NO-GO
  on('acc-gate-go',()=>{S.acc.gateDecide.decision='GO';refresh();});
  on('acc-gate-nogo',()=>{S.acc.gateDecide.decision='NO-GO';refresh();});
  const grEl=q('acc-gate-reason');if(grEl)grEl.oninput=e=>{S.acc.gateDecide.reason=e.target.value;refresh();};
  const gcEl=q('acc-gate-confirm');if(gcEl)gcEl.onchange=e=>{S.acc.gateDecide.confirm=e.target.checked;refresh();};

  on('acc-btn-gate-decide',async()=>{
    if(!S.acc.selectedGate||!S.acc.gateDecide.decision)return;
    if(!S.acc.gateDecide.confirm){alert('Please check the confirmation box.');return;}
    if((S.acc.gateDecide.reason||'').length<50){alert('Reason must be at least 50 characters.');return;}
    S.acc.gateDecideBusy=true;S.acc.gateDecideResult=null;S.acc.gateDecideError='';refresh();
    try{
      const r=await post('/snow/acc/gate/decide',{
        ...creds(),
        gate_id:S.acc.selectedGate,
        decision:S.acc.gateDecide.decision,
        reason:S.acc.gateDecide.reason,
        approver:S.username,
        confirm:true,
      });
      S.acc.gateDecideResult=r;
      logAudit(`Gate ${S.acc.selectedGate}: ${S.acc.gateDecide.decision} by ${S.username}`,'','success');
      // auto-refresh audit log
      accLoadGateAudit();
    }catch(e){S.acc.gateDecideError=e.message;logAudit('Gate decision failed: '+e.message,'','error');}
    S.acc.gateDecideBusy=false;refresh();
  });

  // Gate audit log
  on('acc-btn-gate-audit',accLoadGateAudit);

  // Report
  const reportAiEl=q('acc-report-ai');if(reportAiEl)reportAiEl.onchange=e=>{S.acc.reportAI=e.target.checked;};
  on('acc-btn-report',async()=>{
    S.acc.reportBusy=true;S.acc.reportError='';refresh();
    try{
      const r=await fetch(API+'/snow/acc/report',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({...creds(),data:S.acc.ccData||{},briefing:!!S.acc.reportAI}),
      });
      if(!r.ok)throw new Error(await apiErr(r));
      const blob=await r.blob();
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download='ACC_Command_Center_Report.xlsx';a.click();
      URL.revokeObjectURL(url);
      logAudit('ACC Excel report downloaded','','success');
    }catch(e){S.acc.reportError=e.message;logAudit('ACC report failed: '+e.message,'','error');}
    S.acc.reportBusy=false;refresh();
  });

  // Duplicates
  on('acc-btn-dups',async()=>{
    S.acc.dupBusy=true;S.acc.dupError='';S.acc.dupData=null;refresh();
    try{S.acc.dupData=await post('/snow/acc/duplicates',creds());}
    catch(e){S.acc.dupError=e.message;}
    S.acc.dupBusy=false;refresh();
  });
}

// ACC helpers (outside bind)
function accReadFile(file){
  const rd=new FileReader();
  rd.onload=e=>{S.acc.genText=e.target.result;refresh();};
  if(file.name.endsWith('.txt')||file.name.endsWith('.md'))rd.readAsText(file);
  else{// For docx/pdf, upload to agent for extraction
    const fd=new FormData();fd.append('file',file);
    fetch(API+'/snow/universal',{method:'POST',body:fd})
      .then(r=>r.ok?r.json():Promise.reject(r))
      .then(d=>{S.acc.genText=d.text||d.content||JSON.stringify(d);refresh();})
      .catch(()=>{rd.readAsText(file);});
  }
}

function accPollJob(jobId){
  if(S.acc.genJobPoll)clearInterval(S.acc.genJobPoll);
  S.acc.genJobPoll=setInterval(async()=>{
    try{
      const r=await fetch(API+'/snow/acc/generate/'+jobId);
      if(!r.ok)throw new Error(await apiErr(r));
      const d=await r.json();
      S.acc.genStatus=d;
      if(d.status==='done'||d.status==='failed'){
        clearInterval(S.acc.genJobPoll);S.acc.genJobPoll=null;
        if(d.status==='done')logAudit('ACC package generated','','success');
        else logAudit('ACC generation failed: '+(d.error||'?'),'','error');
      }
      refresh();
    }catch(e){S.acc.genStatus={status:'failed',error:e.message};clearInterval(S.acc.genJobPoll);S.acc.genJobPoll=null;refresh();}
  },3000);
}

async function accLoadGateAudit(){
  S.acc.gateAuditBusy=true;S.acc.gateAuditRows=null;refresh();
  try{const r=await post('/snow/acc/gate/audit',creds());S.acc.gateAuditRows=r.entries||[];}
  catch(e){S.acc.gateAuditRows=[];}
  S.acc.gateAuditBusy=false;refresh();
}
